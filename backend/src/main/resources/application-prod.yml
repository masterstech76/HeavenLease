spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB

app:
  # RDS connection mode. "false" = use DB_PASSWORD (recommended, permanent,
  # needs password auth enabled on RDS). "true" = use IAM token auth (needs
  # GRANT rds_iam TO <user> in the DB + matching AWS_REGION).
  rds-iam-enabled: ${RDS_USE_IAM:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  encryption-key: ${APP_ENCRYPTION_KEY}
  rate-limit:
    enabled: true
    max-requests-per-minute: 20
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  recaptcha:
    site-key: ${RECAPTCHA_SITE_KEY:}
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    version: ${RECAPTCHA_VERSION:v3}
  otp:
    from-email: ${OTP_FROM_EMAIL:no-reply@heavenlease.in}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

aws:
  region: ${AWS_REGION:ap-south-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  dynamodb:
    table-name: ${DYNAMODB_TABLE:HeavenLease_Counters}

# Swagger/API docs are NOT enabled in production (see SecurityConfig dev-profile gate)

logging:
  level:
    com.HeavenLease: INFO
    org.hibernate.SQL: WARN