# HeavenLease — nginx SSL config (for docker-compose.aws.yml)
# Mounted at /etc/nginx/conf.d/default.conf after Let's Encrypt certs exist.
# Certs expected at /etc/letsencrypt/live/heavenlease.in/

# HTTP -> redirect to HTTPS
server {
    listen 80;
    server_name heavenlease.in www.heavenlease.in;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name heavenlease.in www.heavenlease.in;

    ssl_certificate     /etc/letsencrypt/live/heavenlease.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heavenlease.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    root  /usr/share/nginx/html;
    index index.html;

    # Root URL serves index.html directly (200, no intermediate 301 to /index).
    location = / {
        try_files /index.html =404;
    }

    # Legacy /index URL canonicalizes to the root.
    location = /index {
        return 301 /;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Redirect old .html URLs to clean (SEO + old bookmarks)
    location ~* ^/([^/]+)\.html$ {
        return 301 /$1;
    }

    # Old page URL (heavenlease) -> serve the static heavenlease.html hub
    # (public/no-auth). Previously redirected to /home.
    location = /heavenlease {
        try_files /heavenlease.html =404;
    }

    # Static files + clean URLs: /login -> login.html.
    # Unknown/deleted URLs return a clean 404 instead of silently serving
    # the homepage (important for SEO + correct handling of removed pages).
    location / {
        try_files $uri $uri.html =404;
    }

    # Branded error pages — served with clean, status-correct pages via internal
    # redirects so search engines never index them as regular content.
    error_page 401 /401.html;
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 /500.html;
    error_page 502 /502.html;
    error_page 503 /503.html;

    location = /401.html { internal; }
    location = /403.html { internal; }
    location = /404.html { internal; }
    location = /500.html { internal; }
    location = /502.html { internal; }
    location = /503.html { internal; }

    # Clean URL aliases for the error codes: a direct /404 hit must return a real
    # 404 (not a 200 page), which then triggers the branded error_page above.
    location = /401 { return 401; }
    location = /403 { return 403; }
    location = /404 { return 404; }
    location = /500 { return 500; }
    location = /502 { return 502; }
    location = /503 { return 503; }

    # API proxy
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
        add_header Cache-Control "no-store";
    }

    # Uploaded media (avatars, property photos, documents) is stored by the
    # backend container on the shared uploads volume. Without this proxy the
    # avatar/photo URLs (/uploads/...) 404 from nginx and profile uploads look
    # "broken" even though the API saved them successfully.
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # WebSocket proxy for real-time messaging
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;
    }

    # HTML & JS: never long-cache
    location ~* \.(html?|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # CSS: short cache
    location ~* \.(css)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Images/fonts: longer cache
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}