# ============================================================================
# HeavenLease — AWS PRODUCTION compose file (NO local database).
#
# This stack talks ONLY to AWS RDS PostgreSQL. There is NO local Postgres
# service. Point DB_HOST at your RDS endpoint (e.g. from the RDS console)
# and the app connects over TLS (sslmode=require).
#
# Usage (run from backend/):
#   Edit backend/.env.aws  (single config file — replace with YOUR values)
#   docker compose -f docker-compose.aws.yml --env-file .env.aws up -d --build
#
# ============================================================================
services:
  backend:
    build: .
    image: heavenlease-backend:aws
    container_name: HeavenLease-backend
    restart: always
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "busybox wget -q -O /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads
    environment:
      # ---- RDS PostgreSQL (NO local database) ----
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-heavenlease}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - RDS_USE_IAM=${RDS_USE_IAM:-false}
      # ---- Security secrets (generate fresh: openssl rand -base64 48 / 32) ----
      - JWT_SECRET=${JWT_SECRET}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@heavenlease.in}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      # ---- AWS (region + credentials) ----
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - RDS_REGION=${RDS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SES_ACCESS_KEY=${AWS_SES_ACCESS_KEY:-}
      - AWS_SES_SECRET_KEY=${AWS_SES_SECRET_KEY:-}
      - AWS_SES_REGION=${AWS_SES_REGION:-ap-south-1}
      - AWS_SES_FROM_EMAIL=${AWS_SES_FROM_EMAIL:-no-reply@heavenlease.in}
      - AWS_SNS_ACCESS_KEY=${AWS_SNS_ACCESS_KEY:-}
      - AWS_SNS_SECRET_KEY=${AWS_SNS_SECRET_KEY:-}
      - AWS_SNS_REGION=${AWS_SNS_REGION:-ap-south-1}
      - AWS_SNS_SENDER_ID=${AWS_SNS_SENDER_ID:-HEAVEN}
      - DYNAMODB_TABLE=${DYNAMODB_TABLE:-HeavenLease_Counters}
      # ---- Integrations (set via .env.aws or Admin → Integration Settings) ----
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
      - RECAPTCHA_VERSION=${RECAPTCHA_VERSION:-v3}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - OTP_FROM_EMAIL=${OTP_FROM_EMAIL:-no-reply@heavenlease.in}
      - UPLOAD_DIR=/app/uploads
      - SEED_DEMO=false
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_MAX_PER_MINUTE=20
    networks:
      - HeavenLease-net

  nginx:
    image: nginx:alpine
    container_name: HeavenLease-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/app-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ../static:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - HeavenLease-net

volumes:
  uploads-data:

networks:
  HeavenLease-net:
    driver: bridge