<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Edit an existing property listing.">
    <title>Edit Property — HeavenLease</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=20260909a">
    <style>
        .page-header { background: rgba(255,255,255,0.45); backdrop-filter: blur(6px); padding: 140px 0 70px; text-align: center; position: relative; overflow: hidden; }
        .page-header h1 { font-family: var(--font-heading); font-size: 46px; font-weight: 700; color: var(--dark); margin-bottom: 12px; }
        .page-header p { font-size: 17px; color: var(--gray-500); max-width: 640px; margin: 0 auto; }
        .page-header .ph-icon { width: 68px; height: 68px; border-radius: 18px; background: var(--gradient); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 18px; box-shadow: var(--shadow-primary); }
        .page-section { padding: 70px 0 90px; }
        .page-section .section-head { text-align: center; margin-bottom: 44px; }
        .page-section .section-head h2 { font-family: var(--font-heading); font-size: 30px; font-weight: 700; color: var(--dark); }
        .feature-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 26px; }
        .feature-card { background: rgba(255,255,255,0.92); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 28px; transition: var(--transition); box-shadow: var(--shadow-sm); }
        .feature-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
        .feature-card .fc-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--gradient-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 14px; }
        .feature-card h3 { font-size: 17px; font-weight: 600; color: var(--dark); margin-bottom: 6px; }
        .feature-card p { font-size: 14px; color: var(--gray-500); line-height: 1.6; margin: 0; }
        .page-cta { padding: 0 0 90px; }
        .cta-banner { background: var(--gradient); border-radius: var(--radius-xl); padding: 44px 32px; text-align: center; color: #fff; }
        .cta-banner h2 { font-family: var(--font-heading); font-size: 28px; margin-bottom: 8px; }
        .cta-banner p { opacity: 0.92; margin-bottom: 20px; }
        .cta-banner .btn { background: #fff; color: var(--primary); font-weight: 600; }
        .cta-banner .btn.ghost { background: transparent; border: 1px solid #fff; color: #fff; }
        @media (max-width: 900px) { .feature-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .page-header { padding: 120px 0 50px; } .page-header h1 { font-size: 34px; } }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <div class="logo-icon"><i class="fas fa-home"></i></div>
                <span class="logo-text">Heaven<span>Lease</span></span>
            </a>
            <div class="nav-actions">
                <div class="user-menu" id="userMenu">
                    <button class="user-menu-trigger" id="profileBtn" aria-label="Account menu">
                        <span class="user-avatar"><i class="fas fa-user" id="navAvatarIcon"></i></span>
                        <span id="navUserName">Account</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="user-dropdown" id="profileDropdown">
                        <a href="home" id="mainHomeLink"><i class="fas fa-home"></i> Main Home</a>
                        <a href="edit-profile" id="myProfileLink"><i class="fas fa-user"></i> My Profile &amp; Settings</a>
                        <a href="payment"><i class="fas fa-credit-card"></i> Access Pass</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <section class="page-header">
        <div class="container">
            <div class="ph-icon"><i class="fas fa-pen-to-square"></i></div>
            <h1>Edit Property</h1>
            <p>Update any part of your live listing and see a preview before saving.</p>
        </div>
    </section>

    <section class="page-section" style="padding-top:20px;">
        <div class="container" style="max-width: 760px;">
            <div class="section-head" style="text-align:center;margin-bottom:24px;"><h2>Edit Your Listing</h2></div>
            <form id="propForm" style="background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-xl);padding:28px 30px;box-shadow:var(--shadow-sm);">
                <div class="form-group" style="margin-bottom:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">Property ID</label>
                    <input id="pId" type="number" required placeholder="e.g. 12" style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;">
                    <button type="button" class="btn btn-secondary" style="margin-top:10px;" onclick="loadProp()"><i class="fas fa-download"></i> Load Listing</button>
                </div>
                <div id="editFields" style="display:none;">
                    <div class="form-group" style="margin-bottom:16px;">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">Title</label>
                        <input id="fTitle" type="text" style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;">
                    </div>
                    <div class="form-group" style="margin-bottom:16px;">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">Rent (₹/month)</label>
                        <input id="fRent" type="number" min="0" style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;">
                    </div>
                    <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;">
                        <div class="form-group">
                            <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">BHK</label>
                            <input id="fBhk" type="number" min="0" style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;">
                        </div>
                        <div class="form-group">
                            <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">Type</label>
                            <input id="fType" type="text" placeholder="Apartment / Villa / Studio" style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;">
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom:16px;">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">Locality</label>
                        <input id="fLocality" type="text" style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;">
                    </div>
                    <div class="form-group" style="margin-bottom:16px;">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">City</label>
                        <input id="fCity" type="text" style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;">
                    </div>
                    <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px;">
                        <div class="form-group">
                            <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">Quietness %</label>
                            <input id="fQuiet" type="number" min="0" max="100" style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;">
                        </div>
                        <div class="form-group">
                            <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">Sunlight %</label>
                            <input id="fSun" type="number" min="0" max="100" style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;">
                        </div>
                        <div class="form-group">
                            <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">Commute %</label>
                            <input id="fCommute" type="number" min="0" max="100" style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;">
                        </div>
                    </div>
                    <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;">
                        <label style="font-size:14px;color:var(--gray-600);display:flex;align-items:center;gap:8px;"><input id="fPet" type="checkbox"> Pet friendly</label>
                        <label style="font-size:14px;color:var(--gray-600);display:flex;align-items:center;gap:8px;"><input id="fFurn" type="checkbox"> Furnished</label>
                    </div>
                    <div class="form-group" style="margin-bottom:20px;">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">Status</label>
                        <select id="fStatus" style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;">
                            <option value="active">Active</option>
                            <option value="pending">Pending</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;display:inline-flex;justify-content:center;gap:8px;"><i class="fas fa-floppy-disk"></i> Save Changes</button>
                </div>
            </form>
        </div>
    </section>

    <section class="page-cta">
        <div class="container">
            <div class="cta-banner">
                <h2>Ready to continue?</h2>
                <p>Head back to your dashboard or browse the next step.</p>
                                <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
                    <a href="properties-management" class="btn btn-lg"><i class="fas fa-house-circle-check"></i> Manage Properties</a>
                    <a href="list-property" class="btn btn-lg"><i class="fas fa-plus"></i> List a Property</a>
                    <a href="dashboard" class="btn btn-lg"><i class="fas fa-gauge-high"></i> My Dashboard</a>
                    <a href="dashboard" class="btn btn-lg ghost"><i class="fas fa-gauge-high"></i> My Dashboard</a>
                </div>
            </div>
        </div>
    </section>

<script src="api.js?v=20260913a"></script>
    <script src="script.js?v=20260913a"></script>
    <script>
        (function() {
            'use strict';
            const form=document.getElementById('propForm');
            const editFields=document.getElementById('editFields');
            let currentId=null;

            function fill(p){
                currentId=p.id;
                document.getElementById('fTitle').value=p.title||'';
                document.getElementById('fRent').value=p.rentAmount||'';
                document.getElementById('fDeposit').value=p.deposit||'';
                document.getElementById('fBhk').value=p.bhk||'';
                document.getElementById('fType').value=p.propertyType||'';
                document.getElementById('fLocality').value=p.locality||'';
                document.getElementById('fCity').value=p.city||'';
                document.getElementById('fQuiet').value=p.quietness!=null?p.quietness:'';
                document.getElementById('fSun').value=p.sunlight!=null?p.sunlight:'';
                document.getElementById('fCommute').value=p.commute!=null?p.commute:'';
                document.getElementById('fPet').checked=!!p.petFriendly;
                document.getElementById('fFurn').checked=!!p.furnished;
                document.getElementById('fStatus').value=(p.status||'active').toLowerCase();
                editFields.style.display='block';
            }
            window.loadProp=async function(){
                const id=Number(document.getElementById('pId').value||0);
                if(!id){showToast('Enter a property ID first.','error');return;}
                try{
                    const p=await api.getProperty(id);
                    if(!p||!p.id){showToast('Property not found.','error');return;}
                    fill(p);
                }catch(e){showToast(e.message||'Could not load property.','error');}
            };
            if(form){
                form.addEventListener('submit',async function(ev){
                    ev.preventDefault();
                    if(!currentId){showToast('Load a property first.','error');return;}
                    try{
                        const payload={
                            title:document.getElementById('fTitle').value,
                            rentAmount:Number(document.getElementById('fRent').value)||0,
                            deposit:Number(document.getElementById('fDeposit').value)||0,
                            bhk:Number(document.getElementById('fBhk').value)||0,
                            propertyType:document.getElementById('fType').value,
                            locality:document.getElementById('fLocality').value,
                            city:document.getElementById('fCity').value,
                            quietness:Number(document.getElementById('fQuiet').value)||0,
                            sunlight:Number(document.getElementById('fSun').value)||0,
                            commute:Number(document.getElementById('fCommute').value)||0,
                            petFriendly:document.getElementById('fPet').checked,
                            furnished:document.getElementById('fFurn').checked,
                            status:document.getElementById('fStatus').value
                        };
                        await api.updateProperty(currentId,payload);
                        showToast('Property updated!','success');
                    }catch(e){showToast(e.message||'Save failed.','error');}
                });
            }
            (function(){
                const q=new URLSearchParams(window.location.search);
                const id=q.get('id');
                if(id){document.getElementById('pId').value=id;loadProp();}
            })();
        })();
    </script>
</body>
</html>
