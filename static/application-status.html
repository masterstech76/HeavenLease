<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track the progress of your application.">
    <title>Application Status — HeavenLease</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=20260909a">
    <style>
        .page-header { background: rgba(255,255,255,0.45); backdrop-filter: blur(6px); padding: 140px 0 70px; text-align: center; position: relative; overflow: hidden; }
        .page-header h1 { font-family: var(--font-heading); font-size: 46px; font-weight: 700; color: var(--dark); margin-bottom: 12px; }
        .page-header p { font-size: 17px; color: var(--gray-500); max-width: 640px; margin: 0 auto; }
        .page-header .ph-icon { width: 68px; height: 68px; border-radius: 18px; background: var(--gradient); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 18px; box-shadow: var(--shadow-primary); }
        .page-section { padding: 70px 0 90px; }
        .page-section .section-head { text-align: center; margin-bottom: 44px; }
        .page-section .section-head h2 { font-family: var(--font-heading); font-size: 30px; font-weight: 700; color: var(--dark); }
        .feature-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 26px; }
        .feature-card { background: rgba(255,255,255,0.92); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 28px; transition: var(--transition); box-shadow: var(--shadow-sm); }
        .feature-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
        .feature-card .fc-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--gradient-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 14px; }
        .feature-card h3 { font-size: 17px; font-weight: 600; color: var(--dark); margin-bottom: 6px; }
        .feature-card p { font-size: 14px; color: var(--gray-500); line-height: 1.6; margin: 0; }
        .page-cta { padding: 0 0 90px; }
        .cta-banner { background: var(--gradient); border-radius: var(--radius-xl); padding: 44px 32px; text-align: center; color: #fff; }
        .cta-banner h2 { font-family: var(--font-heading); font-size: 28px; margin-bottom: 8px; }
        .cta-banner p { opacity: 0.92; margin-bottom: 20px; }
        .cta-banner .btn { background: #fff; color: var(--primary); font-weight: 600; }
        .cta-banner .btn.ghost { background: transparent; border: 1px solid #fff; color: #fff; }
        @media (max-width: 900px) { .feature-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .page-header { padding: 120px 0 50px; } .page-header h1 { font-size: 34px; } }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <div class="logo-icon"><i class="fas fa-home"></i></div>
                <span class="logo-text">Heaven<span>Lease</span></span>
            </a>
            <div class="nav-actions">
                <div class="user-menu" id="userMenu">
                    <button class="user-menu-trigger" id="profileBtn" aria-label="Account menu">
                        <span class="user-avatar"><i class="fas fa-user" id="navAvatarIcon"></i></span>
                        <span id="navUserName">Account</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="user-dropdown" id="profileDropdown">
                        <a href="home" id="mainHomeLink"><i class="fas fa-home"></i> Main Home</a>
                        <a href="edit-profile" id="myProfileLink"><i class="fas fa-user"></i> My Profile &amp; Settings</a>
                        <a href="payment"><i class="fas fa-credit-card"></i> Access Pass</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <section class="page-header">
        <div class="container">
            <div class="ph-icon"><i class="fas fa-hourglass-half"></i></div>
            <h1>Application Status</h1>
            <p>See exactly where your application stands.</p>
        </div>
    </section>

    <section class="page-section" style="padding-top:20px;">
        <div class="container" style="max-width: 860px;">
            <div class="section-head" style="text-align:center;margin-bottom:28px;"><h2>Application Status</h2></div>
            <div id="statusWrap">
                <p style="text-align:center;color:var(--gray-400);padding:40px 0;"><i class="fas fa-spinner fa-spin"></i> Loading…</p>
            </div>
        </div>
    </section>

    <section class="page-cta">
        <div class="container">
            <div class="cta-banner">
                <h2>Ready to continue?</h2>
                <p>Head back to your dashboard or browse the next step.</p>
                                <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
                    <a href="application-history" class="btn btn-lg"><i class="fas fa-clock-rotate-left"></i> Application History</a>
                    <a href="rental-application" class="btn btn-lg"><i class="fas fa-file-signature"></i> Open Rental Application</a>
                    <a href="dashboard" class="btn btn-lg"><i class="fas fa-gauge-high"></i> My Dashboard</a>
                    <a href="dashboard" class="btn btn-lg ghost"><i class="fas fa-gauge-high"></i> My Dashboard</a>
                </div>
            </div>
        </div>
    </section>

<script src="api.js?v=20260913a"></script>
    <script src="script.js?v=20260913a"></script>
    <script>
        (function() {
            'use strict';
            const user = api.getUser();
            function badge(s){const m={'pending':['status-pending','Pending'],'confirmed':['status-active','Confirmed'],'approved':['status-active','Approved'],'declined':['status-inactive','Declined'],'cancelled':['status-inactive','Cancelled'],'completed':['status-completed','Completed']};const x=m[(s||'').toLowerCase()]||['status-inactive',s||'—'];return '<span class="status '+x[0]+'">'+api.escapeHtml(x[1])+'</span>';}
            function fmtDate(s){if(!s)return '—';const d=new Date(s);return isNaN(d)?s:d;}
            const ORDER=['pending','confirmed','declined','cancelled','completed'];
            const STEPS=[['pending','Submitted','Your request has been sent to the owner.'],['confirmed','Approved','The owner approved this request.'],['declined','Declined','The owner declined this request.'],['completed','Completed','This request has been completed.']];
            const wrap=document.getElementById('statusWrap');
            function card(b){
                const cur=(b.status||'pending').toLowerCase();
                const tl=STEPS.map(function(s){
                    const done=(ORDER.indexOf(s[0])<=ORDER.indexOf(cur))&&cur!=='declined'&&cur!=='cancelled';
                    return '<div style="display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--gray-100);">'
                        +'<div style="width:36px;height:36px;border-radius:50%;background:'+(done?'var(--gradient)':'var(--gray-200)')+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;">'
                        +(done?'<i class="fas fa-check"></i>':'<i class="fas fa-circle"></i>')+'</div>'
                        +'<div><strong style="color:var(--dark);">'+s[1]+'</strong><div style="font-size:13px;color:var(--gray-500);margin-top:2px;">'+s[2]+'</div></div></div>';
                }).join('');
                wrap.innerHTML='<div style="background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-xl);padding:28px 30px;box-shadow:var(--shadow-sm);">'
                    +'<div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:8px;">'
                    +'<h3 style="color:var(--dark);margin:0;">'+api.escapeHtml(b.propertyTitle||('Property #'+b.propertyId))+'</h3>'+badge(b.status)+'</div>'
                    +'<div style="font-size:13px;color:var(--gray-500);margin-bottom:20px;">Tour: '+api.escapeHtml(fmtDate(b.tourDate))+' · '+api.escapeHtml(b.tourTime||'')+' · <a href="application-history">View all</a></div>'
                    +tl+'</div>';
            }
            async function loadStatus(){
                try{
                    const params=new URLSearchParams(window.location.search);
                    const id=params.get('id');
                    if(!user||!user.id){wrap.innerHTML='<div style="text-align:center;padding:40px;color:var(--gray-500);">Please log in to track your application.</div>';return;}
                    if(id){const b=await api.getBooking(Number(id));card(b);return;}
                    let list=await api.getBookingsByTenant(user.id).catch(function(){return[];});
                    if(!Array.isArray(list))list=[];
                    if(list.length===0){wrap.innerHTML='<div style="text-align:center;padding:60px 20px;background:var(--white);border:2px dashed var(--gray-200);border-radius:var(--radius-xl);">'
                        +'<i class="fas fa-hourglass-half" style="font-size:56px;color:var(--gray-300);"></i>'
                        +'<h3 style="margin:16px 0 6px;color:var(--dark);">No applications found</h3>'
                        +'<p style="color:var(--gray-500);margin-bottom:20px;">Apply to a property first and its status will appear here.</p>'
                        +'<a href="properties" class="btn btn-primary" style="display:inline-flex;gap:8px;"><i class="fas fa-building"></i> Browse Properties</a></div>';return;}
                    wrap.innerHTML=list.map(function(b){return '<a href="application-status?id='+b.id+'" style="text-decoration:none;color:inherit;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:18px 22px;margin-bottom:12px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;box-shadow:var(--shadow-sm);">'
                        +'<div><strong style="color:var(--dark);">'+api.escapeHtml(b.propertyTitle||('Property #'+b.propertyId))+'</strong> '+badge(b.status)
                        +'<div style="font-size:12px;color:var(--gray-400);margin-top:6px;">Tour: '+api.escapeHtml(fmtDate(b.tourDate))+' · '+api.escapeHtml(b.tourTime||'')+'</div></div>'
                        +'<i class="fas fa-chevron-right" style="color:var(--gray-400);"></i></a>';}).join('');
                }catch(e){wrap.innerHTML='<div style="text-align:center;padding:40px;color:var(--gray-500);">'+api.escapeHtml(e.message||'Could not load status.')+'</div>';}
            }
            loadStatus();
        })();
    </script>
</body>
</html>
