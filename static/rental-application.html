<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Apply for a rental property.">
    <title>Rental Application — HeavenLease</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=20260909a">
    <style>
        .page-header { background: rgba(255,255,255,0.45); backdrop-filter: blur(6px); padding: 140px 0 70px; text-align: center; position: relative; overflow: hidden; }
        .page-header h1 { font-family: var(--font-heading); font-size: 46px; font-weight: 700; color: var(--dark); margin-bottom: 12px; }
        .page-header p { font-size: 17px; color: var(--gray-500); max-width: 640px; margin: 0 auto; }
        .page-header .ph-icon { width: 68px; height: 68px; border-radius: 18px; background: var(--gradient); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 18px; box-shadow: var(--shadow-primary); }
        .page-section { padding: 70px 0 90px; }
        .page-section .section-head { text-align: center; margin-bottom: 44px; }
        .page-section .section-head h2 { font-family: var(--font-heading); font-size: 30px; font-weight: 700; color: var(--dark); }
        .feature-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 26px; }
        .feature-card { background: rgba(255,255,255,0.92); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 28px; transition: var(--transition); box-shadow: var(--shadow-sm); }
        .feature-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
        .feature-card .fc-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--gradient-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 14px; }
        .feature-card h3 { font-size: 17px; font-weight: 600; color: var(--dark); margin-bottom: 6px; }
        .feature-card p { font-size: 14px; color: var(--gray-500); line-height: 1.6; margin: 0; }
        .page-cta { padding: 0 0 90px; }
        .cta-banner { background: var(--gradient); border-radius: var(--radius-xl); padding: 44px 32px; text-align: center; color: #fff; }
        .cta-banner h2 { font-family: var(--font-heading); font-size: 28px; margin-bottom: 8px; }
        .cta-banner p { opacity: 0.92; margin-bottom: 20px; }
        .cta-banner .btn { background: #fff; color: var(--primary); font-weight: 600; }
        .cta-banner .btn.ghost { background: transparent; border: 1px solid #fff; color: #fff; }
        @media (max-width: 900px) { .feature-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .page-header { padding: 120px 0 50px; } .page-header h1 { font-size: 34px; } }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <div class="logo-icon"><i class="fas fa-home"></i></div>
                <span class="logo-text">Heaven<span>Lease</span></span>
            </a>
            <div class="nav-actions">
                <div class="user-menu" id="userMenu">
                    <button class="user-menu-trigger" id="profileBtn" aria-label="Account menu">
                        <span class="user-avatar"><i class="fas fa-user" id="navAvatarIcon"></i></span>
                        <span id="navUserName">Account</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="user-dropdown" id="profileDropdown">
                        <a href="home" id="mainHomeLink"><i class="fas fa-home"></i> Main Home</a>
                        <a href="edit-profile" id="myProfileLink"><i class="fas fa-user"></i> My Profile &amp; Settings</a>
                        <a href="payment"><i class="fas fa-credit-card"></i> Access Pass</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <section class="page-header">
        <div class="container">
            <div class="ph-icon"><i class="fas fa-file-signature"></i></div>
            <h1>Rental Application</h1>
            <p>Apply to rent a property with verified information.</p>
        </div>
    </section>

    <section class="page-section" style="padding-top:20px;">
        <div class="container" style="max-width: 760px;">
            <div class="section-head" style="text-align:center;margin-bottom:24px;"><h2>Apply to Rent</h2></div>
            <form id="appForm" style="background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-xl);padding:28px 30px;box-shadow:var(--shadow-sm);">
                <div class="form-group" style="margin-bottom:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">Property ID</label>
                    <input id="propId" type="number" required placeholder="e.g. 12 (from the property URL)" style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;">
                    <div id="propPreview" style="display:none;margin-top:10px;padding:12px 16px;background:var(--gray-50);border-radius:var(--radius-md);font-size:13px;color:var(--gray-600);"></div>
                </div>
                <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;">
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">Tour Date</label>
                        <input id="tourDate" type="date" required style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;">
                    </div>
                    <div class="form-group">
                        <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">Tour Time</label>
                        <input id="tourTime" type="time" required style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;">Message to Owner (optional)</label>
                    <textarea id="appMsg" rows="3" placeholder="Tell the owner about yourself..." style="width:100%;padding:12px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:14px;font-family:inherit;"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;display:inline-flex;justify-content:center;gap:8px;"><i class="fas fa-paper-plane"></i> Submit Application</button>
            </form>
        </div>
    </section>

    <section class="page-cta">
        <div class="container">
            <div class="cta-banner">
                <h2>Ready to continue?</h2>
                <p>Head back to your dashboard or browse the next step.</p>
                                <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
                    <a href="application-status" class="btn btn-lg"><i class="fas fa-hourglass-half"></i> Check Application Status</a>
                    <a href="application-history" class="btn btn-lg"><i class="fas fa-clock-rotate-left"></i> Application History</a>
                    <a href="dashboard" class="btn btn-lg"><i class="fas fa-gauge-high"></i> My Dashboard</a>
                    <a href="dashboard" class="btn btn-lg ghost"><i class="fas fa-gauge-high"></i> My Dashboard</a>
                </div>
            </div>
        </div>
    </section>

<script src="api.js?v=20260913a"></script>
    <script src="script.js?v=20260913a"></script>
    <script>
        (function() {
            'use strict';
            const user = api.getUser();
            const form = document.getElementById('appForm');
            const propPreview = document.getElementById('propPreview');

            async function previewProp(){
                const el = document.getElementById('propId');
                const id = Number(el.value||0);
                if(!id){propPreview.style.display='none';return;}
                try{
                    const p = await api.getProperty(id);
                    if(p&&p.id){propPreview.style.display='block';propPreview.innerHTML='<strong>'+api.escapeHtml(p.title||('Property #'+p.id))+'</strong> · '+(p.rentAmount?('₹'+Number(p.rentAmount).toLocaleString('en-IN')+'/mo'):'')+' · '+api.escapeHtml((p.locality||'')+' '+(p.city||''));}
                    else{propPreview.style.display='block';propPreview.innerHTML='<span style="color:#dc2626;">Property not found.</span>';}
                }catch(e){propPreview.style.display='block';propPreview.innerHTML='<span style="color:#dc2626;">'+api.escapeHtml(e.message||'Could not load property.')+'</span>';}
            }
            let debounceTimer;
            document.getElementById('propId').addEventListener('input',function(){clearTimeout(debounceTimer);debounceTimer=setTimeout(previewProp,400);});

            if(form&&user&&user.id){
                // Prefill property id from ?property=
                const q = new URLSearchParams(window.location.search);
                const pid = q.get('property')||q.get('id');
                if(pid){document.getElementById('propId').value=pid;previewProp();}
                form.addEventListener('submit',async function(ev){
                    ev.preventDefault();
                    try{
                        const p = await api.getProperty(Number(document.getElementById('propId').value));
                        if(!p||!p.id){showToast('Property not found. Please check the Property ID.','error');return;}
                        const payload = {
                            propertyId: p.id,
                            tenantId: user.id,
                            ownerId: p.ownerId,
                            tourDate: document.getElementById('tourDate').value,
                            tourTime: document.getElementById('tourTime').value,
                            message: document.getElementById('appMsg').value,
                            tenantName: user.fullName||user.name||'',
                            tenantPhone: user.phone||'',
                            propertyTitle: p.title
                        };
                        await api.createBooking(payload);
                        showToast('Application submitted! The owner will review it.','success');
                        setTimeout(function(){window.location.href='application-status';},1200);
                    }catch(e){showToast(e.message||'Submission failed.','error');}
                });
            }else if(form){
                form.innerHTML='<div style="text-align:center;padding:40px;color:var(--gray-500);">Please <a href="login">log in</a> to apply for a property.</div>';
            }
        })();
    </script>
</body>
</html>
