<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a new password for your HeavenLease account.">
    <title>Reset Password — HeavenLease</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=20260909a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(rgba(15,23,42,0.85), rgba(30,27,75,0.82)), url('bg-home.jpg') center/cover fixed no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -200px;
            left: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
        }
        .auth-container { width: 100%; max-width: 440px; position: relative; z-index: 1; }
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        .back-home:hover { color: #fff; }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .auth-brand .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #4F46E5, #10B981);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4);
        }
        .auth-brand .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }
        .auth-brand .logo-text span { color: #818CF8; }
        .auth-card {
            background: #fff;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .auth-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
            text-align: center;
        }
        .auth-card .subtitle {
            font-size: 14px;
            color: #64748b;
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .input-wrap { position: relative; }
        .input-wrap > i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 15px;
        }
        .input-wrap input {
            width: 100%;
            padding: 12px 40px 12px 42px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
            font-size: 14px;
            color: #0f172a;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .input-wrap input:focus {
            outline: none;
            border-color: #4F46E5;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }
        .input-wrap .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 15px;
            padding: 4px;
        }
        .input-wrap .toggle-password:hover { color: #4F46E5; }
        .btn-auth {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4F46E5, #6366F1);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
        }
        .btn-auth:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4); }
        .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #fff;
            color: #0f172a;
            padding: 14px 24px;
            border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s ease;
            border-left: 4px solid #10B981;
            max-width: 90vw;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-error { border-left-color: #EF4444; }
        .toast-success i { color: #10B981; }
        .toast-error i { color: #EF4444; }
        .success-icon { text-align: center; padding: 20px 0; }
        .success-icon i { font-size: 64px; color: #10B981; }
        .success-msg { text-align: center; font-size: 15px; color: #334155; margin-bottom: 24px; line-height: 1.6; }
    </style>
<script>
        // Back-button auth guard — if a session already exists, never show this auth page.
        (function () {
            try {
                if (localStorage.getItem('heavenlease_token') || sessionStorage.getItem('heavenlease_token')) {
                    location.replace('home');
                }
            } catch (e) { /* storage unavailable — ignore */ }
        })();
    </script>
</head>
<body>
    <div class="auth-container">
        <a href="login" class="back-home">
            <i class="fas fa-arrow-left"></i> Back to Sign In
        </a>

        <div class="auth-brand">
            <div class="logo-icon"><i class="fas fa-home"></i></div>
            <span class="logo-text">Heaven<span>Lease</span></span>
        </div>

        <div class="auth-card">
            <h1>Reset Password</h1>
            <p class="subtitle">Create a new password for your account</p>

            <form id="resetForm">
                <div class="form-group">
                    <label>New Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="newPassword" placeholder="New password (min 8 chars)" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm New Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Re-enter new password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-auth" id="resetBtn">
                    <i class="fas fa-check-circle"></i> Reset Password
                </button>
            </form>

            <div id="successSection" style="display: none;">
                <div class="success-icon"><i class="fas fa-check-circle"></i></div>
                <p class="success-msg">Password reset successfully! You can now sign in with your new password.</p>
                <a href="login" class="btn-auth" style="display: block; text-align: center; text-decoration: none;">
                    <i class="fas fa-sign-in-alt"></i> Go to Sign In
                </a>
            </div>
        </div>
    </div>

    <script src="api.js?v=20260913a"></script>
    <script>
        // Get email + reset token from URL (token is required — issued after OTP verification)
        const params = new URLSearchParams(window.location.search);
        const userEmail = params.get('email') || '';
        const resetToken = params.get('token') || '';

        // If no reset token, redirect back to forgot-password
        if (!resetToken) {
            showToast('Invalid or expired reset link. Please request a new one.', 'error');
            setTimeout(() => { window.location.href = 'forgot-password'; }, 1500);
        }

        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        window.togglePassword = togglePassword;

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 8) {
                showToast('Password must be at least 8 characters.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showToast('Passwords do not match.', 'error');
                return;
            }

            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';

            try {
                // Secure reset: requires the short-lived reset token from OTP verification
                await api.resetPassword(userEmail, resetToken, newPassword);

                // Hide form, show success
                document.getElementById('resetForm').style.display = 'none';
                document.getElementById('successSection').style.display = 'block';
                showToast('Password reset successfully! 🎉', 'success');
            } catch (error) {
                showToast(error.message || 'Failed to reset password.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Reset Password';
            }
        });
    </script>
</body>
</html>
