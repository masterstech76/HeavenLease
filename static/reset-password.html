<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a new password for your HeavenLease account.">
    <title>Reset Password — HeavenLease</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css?v=20260909a">
    <link rel="stylesheet" href="styles.css?v=20260910b">
    <style>
        :root {
            --ink: var(--text-primary);
            --muted: var(--text-secondary);
            --line: var(--border);
            --soft: #f6f7fb;
            --primary: var(--primary);
            --primary-2: var(--primary);
            --accent: var(--success);
            --danger: var(--danger);
            --shadow: 0 28px 80px rgba(2, 6, 23, .34);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { min-height: 100%; }
        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background:
                linear-gradient(115deg, rgba(7,15,31,.94), rgba(30,27,75,.86)),
                url('bg-home.jpg') center / cover fixed no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 34px 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 12% 12%, rgba(99,102,241,.18), transparent 30%),
                radial-gradient(circle at 88% 82%, rgba(16,185,129,.13), transparent 28%);
        }
        .auth-container {
            width: min(100%, 460px);
            position: relative;
            z-index: 1;
        }
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: rgba(255,255,255,.76);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 18px 4px;
            transition: color .2s ease, transform .2s ease;
        }
        .back-home:hover {
            color: #fff;
            transform: translateX(-2px);
        }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 22px;
        }
        .auth-brand .logo-icon {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            color: #fff;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow: 0 14px 32px rgba(79,70,229,.34);
        }
        .auth-brand .logo-text {
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-size: 29px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: -.4px;
        }
        .auth-brand .logo-text span { color: #aeb1ff; }
        .auth-card {
            background: rgba(255,255,255,.97);
            border: 1px solid rgba(255,255,255,.72);
            border-radius: 24px;
            padding: 35px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
        }
        .auth-card h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            font-size: clamp(26px, 5vw, 30px);
            line-height: 1.15;
            letter-spacing: -.4px;
            margin-bottom: 7px;
        }
        .auth-card .subtitle {
            color: var(--muted);
            text-align: center;
            font-size: 13.5px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            color: var(--gray-700);
            font-size: 12px;
            font-weight: 700;
            margin: 0 0 7px 2px;
        }
        .input-wrap { position: relative; }
        .input-wrap > i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
            transition: color .2s ease;
        }
        .input-wrap input {
            width: 100%;
            height: 49px;
            padding: 0 44px 0 42px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--soft);
            color: var(--ink);
            font: 500 13.5px 'Inter', sans-serif;
            transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
        }
        .input-wrap input::placeholder { color: #a0aec0; }
        .input-wrap input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79,70,229,.10);
        }
        .input-wrap:focus-within > i { color: var(--primary); }
        .input-wrap .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: background .2s ease, color .2s ease;
        }
        .input-wrap .toggle-password:hover {
            color: var(--primary);
            background: var(--primary-light);
        }
        .btn-auth {
            width: 100%;
            min-height: 49px;
            border: 0;
            border-radius: 12px;
            padding: 13px 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #fff;
            font: 700 14px 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 9px 24px rgba(79,70,229,.25);
            transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
        }
        .btn-auth:hover {
            transform: translateY(-1px);
            box-shadow: 0 13px 30px rgba(79,70,229,.32);
        }
        .btn-auth:disabled {
            opacity: .62;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .success-icon {
            display: grid;
            place-items: center;
            padding: 18px 0 12px;
        }
        .success-icon i {
            display: grid;
            place-items: center;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            color: var(--accent);
            background: #ecfdf5;
            box-shadow: inset 0 0 0 1px #bbf7d0;
            font-size: 46px;
        }
        .success-msg {
            max-width: 330px;
            margin: 0 auto 23px;
            color: var(--gray-700);
            text-align: center;
            font-size: 13.5px;
            line-height: 1.65;
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%) translateY(100px);
            width: max-content;
            max-width: min(90vw, 520px);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 18px;
            border-radius: 12px;
            background: #fff;
            color: var(--ink);
            box-shadow: 0 16px 45px rgba(0,0,0,.18);
            border-left: 4px solid var(--accent);
            font-size: 13px;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transition: opacity .25s ease, transform .25s ease;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast-error { border-left-color: var(--danger); }
        .toast-success i { color: var(--accent); }
        .toast-error i { color: var(--danger); }
        @media (max-width: 560px) {
            body {
                align-items: flex-start;
                padding: 22px 14px 30px;
                background-attachment: scroll;
            }
            .auth-container { max-width: 500px; }
            .back-home { margin-left: 2px; }
            .auth-brand {
                margin-bottom: 18px;
            }
            .auth-card {
                padding: 26px 20px;
                border-radius: 20px;
            }
        }
        @media (max-width: 360px) {
            .auth-card { padding: 23px 16px; }
            .auth-brand .logo-text { font-size: 26px; }
            .auth-brand .logo-icon {
                width: 44px;
                height: 44px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
<style>/* HeavenLease brand mark */ .brand-logo-image{width:100%;height:100%;display:block;object-fit:contain;border-radius:inherit}.logo-icon,.hl-logo-icon,.logo-mark,.mark{overflow:hidden}</style>
</head>
<body>
    <div class="auth-container">
        <a href="login" class="back-home">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Sign In</span>
        </a>
        <div class="auth-brand">
            <div class="logo-icon"><img src="logo.svg" alt="HeavenLease" class="brand-logo-image"></div>
            <span class="logo-text">Heaven<span>Lease</span></span>
        </div>
        <div class="auth-card">
            <h1>Reset Password</h1>
            <p class="subtitle">Create a new password for your account</p>
            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="newPassword" placeholder="New password (min 8 chars)" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)" aria-label="Show or hide new password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)" aria-label="Show or hide confirmed password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-auth" id="resetBtn">
                    <i class="fas fa-check-circle"></i> Reset Password
                </button>
            </form>
            <div id="successSection" style="display: none;">
                <div class="success-icon"><i class="fas fa-check-circle"></i></div>
                <p class="success-msg">Password reset successfully! You can now sign in with your new password.</p>
                <a href="login" class="btn-auth" style="display: block; text-align: center; text-decoration: none;">
                    <i class="fas fa-sign-in-alt"></i> Go to Sign In
                </a>
            </div>
        </div>
    </div>
    <script src="js/api.js?v=20260915a"></script>
    
    <script src="js/pages/reset-password.js?v=20260915a"></script>
</body>
</html>
