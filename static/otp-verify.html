<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Verify your HeavenLease account with the OTP sent to your email or phone.">
    <title>OTP Verification — HeavenLease</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css?v=20260909a">
    <link rel="stylesheet" href="styles.css?v=20260915a">
    <style>
        :root {
            --otp-ink: #17231f;
            --otp-muted: #72807a;
            --otp-border: rgba(23,35,31,.10);
            --otp-green: #2f8061;
            --otp-green-dark: #225d46;
            --otp-green-soft: #e8f3ed;
            --otp-indigo: #5368d8;
            --otp-surface: rgba(255,255,255,.97);
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: var(--otp-ink);
            min-height: 100vh;
            padding: 32px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            background:
                linear-gradient(135deg, rgba(16,31,25,.88), rgba(29,46,39,.78)),
                url('bg-home.jpg') center/cover fixed no-repeat;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 12% 20%, rgba(132,190,160,.18), transparent 30%),
                radial-gradient(circle at 88% 78%, rgba(83,104,216,.13), transparent 28%);
        }
        body::after {
            content: '';
            position: fixed;
            width: 540px;
            height: 540px;
            right: -230px;
            top: -260px;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 50%;
            box-shadow:
                0 0 0 34px rgba(255,255,255,.025),
                0 0 0 68px rgba(255,255,255,.018);
            pointer-events: none;
        }
        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 470px;
        }
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 18px 2px;
            color: rgba(255,255,255,.76);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: color .2s ease, transform .2s ease;
        }
        .back-home:hover {
            color: #fff;
            transform: translateX(-2px);
        }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            margin-bottom: 22px;
        }
        .auth-brand .logo-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            background: linear-gradient(145deg, #2f8061, #5ba17f);
            box-shadow: 0 12px 28px rgba(0,0,0,.22);
        }
        .auth-brand .logo-text {
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-size: 29px;
            font-weight: 700;
            letter-spacing: -.025em;
        }
        .auth-brand .logo-text span {
            color: #a8d7c0;
        }
        .auth-card {
            position: relative;
            overflow: hidden;
            padding: 38px;
            border: 1px solid rgba(255,255,255,.64);
            border-radius: 24px;
            background: var(--otp-surface);
            box-shadow: 0 30px 80px rgba(0,0,0,.28);
            backdrop-filter: blur(18px);
        }
        .auth-card::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--otp-green), #79b895, #5368d8);
        }
        .verify-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--otp-green);
            background: linear-gradient(145deg, #eaf5ef, #f2f7f5);
            box-shadow: inset 0 0 0 1px rgba(47,128,97,.08), 0 12px 28px rgba(30,62,48,.08);
        }
        .verify-icon i {
            font-size: 29px;
        }
        .auth-card h1 {
            margin: 0 0 7px;
            text-align: center;
            color: var(--otp-ink);
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -.02em;
        }
        .auth-card .subtitle {
            max-width: 360px;
            margin: 0 auto 28px;
            text-align: center;
            color: var(--otp-muted);
            font-size: 13px;
            line-height: 1.65;
        }
        .auth-card .subtitle strong {
            color: #44534c;
            font-weight: 700;
            overflow-wrap: anywhere;
        }
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 9px;
            margin-bottom: 19px;
        }
        .otp-inputs input {
            width: 48px;
            height: 56px;
            padding: 0;
            border: 1px solid #dfe7e2;
            border-radius: 13px;
            background: #f7faf8;
            color: var(--otp-ink);
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 700;
            caret-color: var(--otp-green);
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease, transform .2s ease;
        }
        .otp-inputs input:hover {
            border-color: #c8d7ce;
            background: #fff;
        }
        .otp-inputs input:focus {
            outline: none;
            border-color: var(--otp-green);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(47,128,97,.10);
            transform: translateY(-1px);
        }
        #otpPreviewBox {
            margin-top: 16px !important;
            padding: 14px 16px !important;
            border: 1px dashed rgba(83,104,216,.35) !important;
            border-radius: 14px !important;
            background: #f0f3ff !important;
        }
        #otpPreviewBox div {
            color: #69728a !important;
        }
        #otpPreviewValue {
            display: block;
            margin: 3px 0;
            color: var(--otp-indigo) !important;
            font-size: 27px !important;
            letter-spacing: 7px !important;
        }
        .btn-auth {
            width: 100%;
            min-height: 48px;
            padding: 13px 16px;
            border: 0;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(135deg, #2f8061, #3e9672);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(47,128,97,.22);
            transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
        }
        .btn-auth:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(47,128,97,.28);
        }
        .btn-auth:disabled {
            opacity: .62;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .resend-link {
            margin-top: 15px;
            text-align: center;
            color: #7a8580;
            font-size: 12px;
        }
        .resend-link button {
            padding: 0;
            border: 0;
            background: none;
            color: var(--otp-green);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .resend-link button:hover:not(:disabled) {
            text-decoration: underline;
        }
        .resend-link button:disabled {
            color: #a4ada8;
            cursor: not-allowed;
        }
        .success-icon {
            padding: 20px 0 8px;
            text-align: center;
        }
        .success-icon i {
            font-size: 58px;
            color: var(--otp-green);
        }
        .success-msg {
            margin: 0 0 20px;
            color: #44524c;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 9999;
            max-width: min(90vw, 460px);
            padding: 13px 20px;
            border-left: 4px solid #2f8061;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #24312b;
            background: #fff;
            box-shadow: 0 16px 45px rgba(0,0,0,.18);
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transform: translateX(-50%) translateY(100px);
            transition: all .3s ease;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast-error { border-left-color: #dc4d4d; }
        .toast-success i { color: #2f8061; }
        .toast-error i { color: #dc4d4d; }
        @media (max-width: 520px) {
            body {
                padding: 22px 14px;
                align-items: flex-start;
            }
            .auth-container {
                margin-top: 5vh;
            }
            .back-home {
                margin-bottom: 15px;
            }
            .auth-brand {
                margin-bottom: 18px;
            }
            .auth-brand .logo-icon {
                width: 42px;
                height: 42px;
                border-radius: 12px;
                font-size: 18px;
            }
            .auth-brand .logo-text {
                font-size: 26px;
            }
            .auth-card {
                padding: 30px 20px 26px;
                border-radius: 20px;
            }
            .auth-card h1 {
                font-size: 25px;
            }
            .otp-inputs {
                gap: 6px;
            }
            .otp-inputs input {
                width: min(13vw, 46px);
                height: 52px;
                border-radius: 11px;
                font-size: 20px;
            }
        }
        @media (max-width: 360px) {
            .auth-card {
                padding-left: 15px;
                padding-right: 15px;
            }
            .otp-inputs {
                gap: 5px;
            }
            .otp-inputs input {
                width: 41px;
                height: 49px;
            }
            #otpPreviewValue {
                letter-spacing: 5px !important;
                font-size: 24px !important;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
            }
        }
    </style>
<style>/* HeavenLease brand mark */ .brand-logo-image{width:100%;height:100%;display:block;object-fit:contain;border-radius:inherit}.logo-icon,.hl-logo-icon,.logo-mark,.mark{overflow:hidden}</style>
</head>
<body>
    <div class="auth-container">
        <a href="login" class="back-home">
            <i class="fas fa-arrow-left"></i> Back to Sign In
        </a>
        <div class="auth-brand">
            <div class="logo-icon"><img src="logo.svg" alt="HeavenLease" class="brand-logo-image"></div>
            <span class="logo-text">Heaven<span>Lease</span></span>
        </div>
        <div class="auth-card">
            <div class="verify-icon"><i class="fas fa-shield-halved"></i></div>
            <h1>OTP Verification</h1>
            <p class="subtitle">Enter the 6-digit code sent to <strong id="otpTarget">your email/phone</strong> to continue.</p>
            <div class="otp-inputs" id="otpInputs">
                <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
            </div>
            <!-- Self-hosted OTP preview: shows the code when no SMS gateway is available -->
            <div id="otpPreviewBox" style="display:none;margin-top:16px;padding:14px 16px;background:var(--primary-light);border:1px dashed var(--primary);border-radius:12px;text-align:center;">
                <div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;">You are viewing your OTP (delivered on-screen because SMS is unavailable)</div>
                <strong id="otpPreviewValue" style="font-size:28px;letter-spacing:8px;color:var(--primary);"></strong>
                <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Expires in 10 minutes.</div>
            </div>
            <button class="btn-auth" id="verifyBtn" onclick="verifyOtp()">
                <i class="fas fa-check-circle"></i> Verify OTP
            </button>
            <div class="resend-link">
                Didn't receive it? <button type="button" id="resendBtn" onclick="resendOtp()">Resend</button>
            </div>
            <div id="successSection" style="display: none; margin-top: 20px;">
                <div class="success-icon"><i class="fas fa-check-circle"></i></div>
                <p class="success-msg">OTP verified successfully! Redirecting...</p>
            </div>
        </div>
    </div>
    <script src="js/api.js?v=20260915a"></script>
    
    <script src="js/pages/otp-verify.js?v=20260915a"></script>
</body>
</html>
