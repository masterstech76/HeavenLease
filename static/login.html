<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to HeavenLease. Login with email, phone, OTP, or Google.">
    <title>Sign In — HeavenLease</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css?v=20260909a">
    <link rel="stylesheet" href="styles.css?v=20260915a">
    <style>
        :root {
            --auth-bg: var(--text-primary);
            --auth-card-bg: #ffffff;
            --auth-primary: var(--primary);
            --auth-accent: var(--secondary);
            --auth-ink: var(--text-primary);
            --auth-muted: var(--text-secondary);
            --auth-line: #e5e7eb;
            --auth-soft: var(--surface-soft);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { min-height: 100%; }
        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--auth-ink);
            background:
                linear-gradient(115deg, rgba(7, 14, 29, .94), rgba(24, 24, 65, .84)),
                url('bg-home.jpg') center / cover fixed no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 12% 18%, rgba(99, 102, 241, .20), transparent 30%),
                radial-gradient(circle at 90% 82%, rgba(16, 185, 129, .12), transparent 28%);
        }
        body::after {
            content: '';
            position: fixed;
            width: 560px;
            height: 560px;
            top: -290px;
            right: -250px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.10);
            box-shadow:
                0 0 0 75px rgba(255,255,255,.018),
                0 0 0 150px rgba(255,255,255,.010);
            pointer-events: none;
        }
        .auth-wrapper {
            width: min(100%, 470px);
            position: relative;
            z-index: 1;
        }
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 17px 4px;
            color: rgba(255,255,255,.76);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: color .2s ease, transform .2s ease;
        }
        .back-home:hover {
            color: #fff;
            transform: translateX(-2px);
        }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            text-decoration: none;
        }
        .auth-brand .logo-icon {
            width: 46px;
            height: 46px;
            flex: 0 0 46px;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 20px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--auth-primary), var(--auth-accent));
            box-shadow: 0 12px 30px rgba(79,70,229,.34);
        }
        .auth-brand .logo-text {
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-size: 29px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: -.5px;
        }
        .auth-brand .logo-text span { color: #aeb1ff; }
        .auth-card {
            background: rgba(255,255,255,.97);
            border: 1px solid rgba(255,255,255,.72);
            border-radius: 24px;
            padding: 34px 38px 30px;
            box-shadow:
                0 30px 90px rgba(0,0,0,.38),
                0 8px 24px rgba(0,0,0,.12);
            backdrop-filter: blur(14px);
        }
        .auth-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(28px, 5vw, 34px);
            line-height: 1.15;
            font-weight: 700;
            color: var(--auth-ink);
            text-align: center;
            margin-bottom: 7px;
            letter-spacing: -.4px;
        }
        .auth-card .subtitle {
            color: var(--auth-muted);
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            padding: 4px;
            margin-bottom: 24px;
            background: #f0f2f7;
            border: 1px solid #e7e9ef;
            border-radius: 13px;
        }
        .auth-tab {
            min-height: 40px;
            padding: 9px 7px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: var(--text-secondary);
            font: 700 12px 'Inter', sans-serif;
            cursor: pointer;
            transition: color .2s ease, background .2s ease, box-shadow .2s ease;
        }
        .auth-tab:hover { color: var(--auth-primary); }
        .auth-tab.active {
            color: var(--auth-primary);
            background: #fff;
            box-shadow: 0 2px 10px rgba(15,23,42,.08);
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .form-group { margin-bottom: 17px; }
        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: var(--gray-700);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .01em;
        }
        .input-wrap { position: relative; }
        .input-wrap > i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
            z-index: 1;
        }
        .input-wrap input {
            width: 100%;
            min-height: 50px;
            padding: 13px 42px 13px 43px;
            border: 1px solid var(--auth-line);
            border-radius: 12px;
            outline: none;
            background: var(--auth-soft);
            color: var(--auth-ink);
            font: 500 14px 'Inter', sans-serif;
            transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
        }
        .input-wrap input::placeholder { color: var(--text-muted); }
        .input-wrap input:hover { border-color: var(--gray-300); }
        .input-wrap input:focus {
            border-color: var(--auth-primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79,70,229,.11);
        }
        .input-wrap .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
        }
        .input-wrap .toggle-password:hover {
            color: var(--auth-primary);
            background: var(--primary-light);
        }
        .form-row-between {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 17px;
        }
        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
        }
        .checkbox-label input {
            width: 15px;
            height: 15px;
            accent-color: var(--auth-primary);
        }
        .forgot-link {
            color: var(--auth-primary);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
        }
        .forgot-link:hover { text-decoration: underline; }
        .btn-auth {
            width: 100%;
            min-height: 50px;
            padding: 13px 16px;
            border: 0;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            background: linear-gradient(135deg, var(--auth-primary), var(--primary));
            color: #fff;
            font: 700 14px 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(79,70,229,.24);
            transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
        }
        .btn-auth:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(79,70,229,.30);
        }
        .btn-auth:active { transform: translateY(0); }
        .btn-auth:disabled {
            opacity: .62;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-otp {
            width: 100%;
            min-height: 48px;
            padding: 12px;
            border: 1px solid #dfe3eb;
            border-radius: 12px;
            background: var(--surface-soft);
            color: var(--auth-primary);
            font: 700 13px 'Inter', sans-serif;
            cursor: pointer;
            margin-bottom: 17px;
            transition: border-color .2s ease, background .2s ease, transform .2s ease;
        }
        .btn-otp:hover {
            border-color: #aeb1ff;
            background: var(--primary-light);
            transform: translateY(-1px);
        }
        .btn-otp:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }
        .recaptcha-row {
            margin: 4px 0 2px;
            display: none;
        }
        .auth-hint {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0 12px;
            padding: 10px 14px;
            border-radius: 10px;
            background: #fef3c7;
            border: 1px solid #fcd34d;
            color: #92400e;
            font-size: 12.5px;
            line-height: 1.4;
        }
        .auth-hint i {
            color: var(--warning-dark);
            flex-shrink: 0;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 13px;
            margin: 22px 0;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        .auth-divider span {
            color: var(--text-muted);
            font-size: 11px;
            white-space: nowrap;
        }
        .social-btns { display: flex; gap: 10px; }
        .social-btn {
            flex: 1;
            min-height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 14px;
            border: 1px solid #dfe3eb;
            border-radius: 12px;
            background: #fff;
            color: var(--gray-700);
            font: 600 13px 'Inter', sans-serif;
            cursor: pointer;
            transition: border-color .2s ease, background .2s ease, transform .2s ease;
        }
        .social-btn:hover {
            background: var(--surface-soft);
            border-color: var(--gray-300);
            transform: translateY(-1px);
        }
        .social-btn .fa-google {
            color: #ea4335;
            font-size: 17px;
        }
        .social-btn .fa-mobile-screen {
            color: var(--auth-accent);
            font-size: 17px;
        }
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin-bottom: 17px;
        }
        .otp-inputs input {
            width: 45px;
            height: 52px;
            padding: 0;
            border: 1px solid var(--auth-line);
            border-radius: 11px;
            outline: none;
            background: var(--auth-soft);
            color: var(--auth-ink);
            text-align: center;
            font: 800 21px 'Inter', sans-serif;
            transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
        }
        .otp-inputs input:hover { border-color: var(--gray-300); }
        .otp-inputs input:focus {
            border-color: var(--auth-primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79,70,229,.11);
        }
        .otp-info {
            margin: 0 auto 17px;
            max-width: 340px;
            color: var(--auth-muted);
            font-size: 12.5px;
            line-height: 1.6;
            text-align: center;
        }
        .otp-info strong {
            color: var(--auth-primary);
            overflow-wrap: anywhere;
        }
        .resend-link {
            margin-top: 14px;
            color: var(--auth-muted);
            font-size: 12px;
            text-align: center;
        }
        .resend-link button {
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--auth-primary);
            font: 700 12px 'Inter', sans-serif;
            cursor: pointer;
        }
        .resend-link button:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
        }
        .otp-preview-box {
            margin: 14px 0 !important;
            border-radius: 12px !important;
            background: var(--primary-light) !important;
            border: 1px dashed var(--auth-primary) !important;
            color: #1e1b4b !important;
        }
        .otp-preview-box strong {
            color: var(--auth-primary) !important;
        }
        .auth-switch {
            margin-top: 21px;
            padding-top: 19px;
            border-top: 1px solid #eef0f4;
            color: var(--auth-muted);
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }
        .auth-switch a {
            color: var(--auth-primary);
            font-weight: 800;
            text-decoration: none;
        }
        .auth-switch a:hover { text-decoration: underline; }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            width: max-content;
            max-width: min(90vw, 580px);
            padding: 13px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #e5e7eb;
            border-left: 4px solid var(--auth-accent);
            border-radius: 12px;
            background: rgba(255,255,255,.98);
            color: var(--auth-ink);
            box-shadow: 0 16px 45px rgba(0,0,0,.20);
            font-size: 13px;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transform: translateX(-50%) translateY(100px);
            transition: opacity .3s ease, transform .3s ease;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast-error { border-left-color: var(--danger); }
        .toast-success i { color: var(--auth-accent); }
        .toast-error i { color: var(--danger); }
        @media (max-width: 560px) {
            body {
                align-items: flex-start;
                padding: 22px 14px;
            }
            .auth-wrapper { margin: auto 0; }
            .back-home { margin-left: 2px; }
            .auth-card {
                padding: 28px 20px 24px;
                border-radius: 20px;
            }
            .auth-brand { margin-bottom: 17px; }
            .auth-brand .logo-icon {
                width: 42px;
                height: 42px;
                flex-basis: 42px;
                border-radius: 12px;
                font-size: 18px;
            }
            .auth-brand .logo-text { font-size: 26px; }
            .auth-tabs { gap: 4px; }
            .auth-tab {
                min-height: 38px;
                padding-inline: 4px;
                font-size: 11px;
            }
            .social-btns { flex-direction: column; }
            .otp-inputs { gap: 6px; }
            .otp-inputs input {
                width: 42px;
                height: 50px;
            }
        }
        @media (max-width: 370px) {
            .auth-card { padding-inline: 16px; }
            .otp-inputs { gap: 4px; }
            .otp-inputs input {
                width: 38px;
                height: 47px;
                font-size: 19px;
            }
            .auth-tab { font-size: 10px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
<style>/* HeavenLease brand mark */ .brand-logo-image{width:100%;height:100%;display:block;object-fit:contain;border-radius:inherit}.logo-icon,.hl-logo-icon,.logo-mark,.mark{overflow:hidden}</style>
</head>
<body>
    <div class="auth-wrapper">
        <a href="/" class="back-home">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        <div class="auth-brand">
            <div class="logo-icon"><img src="logo.svg" alt="HeavenLease" class="brand-logo-image"></div>
            <span class="logo-text">Heaven<span>Lease</span></span>
        </div>
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to your HeavenLease account</p>
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="password">Password</button>
                <button class="auth-tab" data-tab="email-otp">Email OTP</button>
                <button class="auth-tab" data-tab="phone-otp">Phone OTP</button>
            </div>
            <!-- Password Login -->
            <div class="tab-pane active" id="tab-password">
                <form id="passwordLoginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="loginEmail" name="loginEmail" placeholder="you@example.com" autocomplete="email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="loginPassword" name="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-row-between">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember me</span>
                        </label>
                        <a href="forgot-password" class="forgot-link">Forgot Password?</a>
                    </div>
                    <!-- reCAPTCHA v2 checkbox placeholder.
                         Hidden by default; revealed by api.js ONLY when RECAPTCHA_VERSION=v2
                         and the real checkbox has rendered — so there is never an empty gap. -->
                    <div class="form-group recaptcha-row" style="display:none;">
                        <div data-recaptcha-v2 style="transform: scale(0.9); transform-origin: 0 0;"></div>
                    </div>
                    <button type="submit" class="btn-auth" id="passwordSubmitBtn">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                </form>
            </div>
            <!-- Email OTP Login -->
            <div class="tab-pane" id="tab-email-otp">
                <form id="emailOtpForm">
                    <div class="form-group">
                        <label for="otpEmail">Email Address</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="otpEmail" name="otpEmail" placeholder="you@example.com" autocomplete="email" required>
                        </div>
                    </div>
                    <button type="button" class="btn-otp" id="sendEmailOtpBtn" onclick="sendEmailOtp()">
                        <i class="fas fa-paper-plane"></i> Send OTP to Email
                    </button>
                    <div id="emailOtpSection" style="display: none;">
                        <div class="otp-inputs" id="emailOtpInputs">
                            <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                            <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                            <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                            <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                            <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                            <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                        </div>
                        <div class="otp-info">Enter the 6-digit code sent to <strong id="emailOtpTarget"></strong></div>
                        <button type="button" class="btn-auth" onclick="verifyEmailOtpLogin()">
                            <i class="fas fa-check-circle"></i> Verify & Sign In
                        </button>
                    </div>
                </form>
            </div>
            <!-- Phone OTP Login -->
            <div class="tab-pane" id="tab-phone-otp">
                <form id="phoneOtpForm">
                    <div class="form-group">
                        <label for="otpPhone">Phone Number</label>
                        <div class="input-wrap">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="otpPhone" name="otpPhone" placeholder="10-digit mobile number" autocomplete="tel" required>
                        </div>
                    </div>
                    <button type="button" class="btn-otp" id="sendPhoneOtpBtn" onclick="sendPhoneOtp()">
                        <i class="fas fa-paper-plane"></i> Send OTP to Phone
                    </button>
                    <div id="phoneOtpSection" style="display: none;">
                        <!-- Self-hosted OTP preview: shows the code when no SMS gateway is available -->
                        <div id="phoneOtpPreviewBox" class="otp-preview-box" style="display:none;margin:14px 0;padding:12px 16px;background:var(--primary-light);border:1px dashed var(--primary);border-radius:12px;text-align:center;font-size:14px;color:#1e1b4b;">
                            <div style="font-weight:600;margin-bottom:4px;"><i class="fas fa-mobile-screen"></i> Your OTP</div>
                            <strong id="phoneOtpPreviewValue" style="font-size:26px;letter-spacing:6px;color:var(--primary);"></strong>
                            <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Check your notifications too — the code expires in 10 minutes.</div>
                        </div>
                        <div class="otp-inputs" id="phoneOtpInputs">
                            <input type="text" maxlength="1" name="otp1" class="otp-digit" oninput="handleOtpInput(this)">
                            <input type="text" maxlength="1" name="otp2" class="otp-digit" oninput="handleOtpInput(this)">
                            <input type="text" maxlength="1" name="otp3" class="otp-digit" oninput="handleOtpInput(this)">
                            <input type="text" maxlength="1" name="otp4" class="otp-digit" oninput="handleOtpInput(this)">
                            <input type="text" maxlength="1" name="otp5" class="otp-digit" oninput="handleOtpInput(this)">
                            <input type="text" maxlength="1" name="otp6" class="otp-digit" oninput="handleOtpInput(this)">
                        </div>
                        <div class="otp-info">Enter the 6-digit code sent to <strong id="phoneOtpTarget"></strong></div>
                        <button type="button" class="btn-auth" onclick="verifyPhoneOtpLogin()">
                            <i class="fas fa-check-circle"></i> Verify & Sign In
                        </button>
                    </div>
                </form>
            </div>
            <!-- Divider -->
            <div class="auth-divider">
                <span>or continue with</span>
            </div>
            <!-- Social -->
            <div class="social-btns">
                <button type="button" class="social-btn" id="googleBtn">
                    <i class="fab fa-google"></i> Google
                </button>
            </div>
            <p class="auth-switch">
                Don't have an account? <a href="signup">Create Account</a>
            </p>
        </div>
    </div>
    <script src="js/api.js?v=20260915a"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="js/pages/login.js?v=20260915a"></script>
</body>
</html>
