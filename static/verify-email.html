<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Verify your email address on HeavenLease with the OTP sent to your inbox.">
    <title>Verify Email — HeavenLease</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css?v=20260909a">
    <link rel="stylesheet" href="styles.css?v=20260915a">
    <style>
        :root {
            --ink: var(--text-primary);
            --muted: var(--text-secondary);
            --line: var(--border);
            --surface: #ffffff;
            --soft: #f6f7fb;
            --primary: var(--primary);
            --primary-2: var(--primary);
            --success: var(--success);
            --danger: var(--danger);
            --shadow: 0 28px 80px rgba(2, 6, 23, .30);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { min-height: 100%; }
        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            overflow-x: hidden;
            position: relative;
            isolation: isolate;
            background:
                linear-gradient(115deg, rgba(8, 15, 31, .92), rgba(30, 27, 75, .78)),
                url('bg-home.jpg') center / cover no-repeat;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(circle at 82% 18%, rgba(99, 102, 241, .24), transparent 30%),
                radial-gradient(circle at 12% 84%, rgba(16, 185, 129, .14), transparent 28%);
            pointer-events: none;
        }
        body::after {
            content: "";
            position: fixed;
            width: 520px;
            height: 520px;
            right: -240px;
            bottom: -280px;
            z-index: -1;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 50%;
            box-shadow:
                0 0 0 90px rgba(255,255,255,.025),
                0 0 0 180px rgba(255,255,255,.018);
            pointer-events: none;
        }
        .auth-container {
            width: 100%;
            max-width: 470px;
            position: relative;
            z-index: 1;
        }
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 18px 2px;
            color: rgba(255,255,255,.72);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color .2s ease, transform .2s ease;
        }
        .back-home:hover {
            color: #fff;
            transform: translateX(-2px);
        }
        .brand-wrap {
            text-align: center;
            margin-bottom: 22px;
        }
        .auth-brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
        }
        .logo-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--success));
            box-shadow: 0 12px 30px rgba(79,70,229,.34);
        }
        .logo-text {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-size: 29px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: -.4px;
        }
        .logo-text span { color: #aeb1ff; }
        .auth-card {
            background: rgba(255,255,255,.97);
            border: 1px solid rgba(255,255,255,.68);
            border-radius: 24px;
            padding: 38px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }
        .card-kicker {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
            color: var(--primary);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }
        .verify-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            color: var(--primary);
            background: linear-gradient(145deg, var(--primary-light), var(--surface-soft));
            border: 1px solid var(--primary-light);
            box-shadow: inset 0 1px 0 #fff;
        }
        .verify-icon i { font-size: 27px; }
        .auth-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(25px, 5vw, 30px);
            line-height: 1.15;
            font-weight: 700;
            text-align: center;
            letter-spacing: -.3px;
            margin-bottom: 8px;
        }
        .subtitle {
            max-width: 380px;
            margin: 0 auto 25px;
            color: var(--muted);
            font-size: 13.5px;
            line-height: 1.7;
            text-align: center;
        }
        .email-display {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            margin-bottom: 20px;
            padding: 11px 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: linear-gradient(180deg, var(--surface-soft), var(--gray-100));
            color: var(--gray-700);
            font-size: 13.5px;
            font-weight: 700;
            text-align: center;
            overflow-wrap: anywhere;
        }
        .otp-label {
            display: block;
            margin-bottom: 10px;
            color: var(--gray-700);
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 9px;
            margin-bottom: 20px;
        }
        .otp-inputs input {
            width: 48px;
            height: 56px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--soft);
            color: var(--ink);
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 800;
            caret-color: var(--primary);
            transition: border-color .18s ease, box-shadow .18s ease, background .18s ease, transform .18s ease;
        }
        .otp-inputs input:hover { border-color: var(--gray-300); }
        .otp-inputs input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            transform: translateY(-1px);
            box-shadow: 0 0 0 4px rgba(79,70,229,.11);
        }
        .btn-auth {
            width: 100%;
            min-height: 50px;
            border: 0;
            border-radius: 12px;
            padding: 13px 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(79,70,229,.25);
            transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
        }
        .btn-auth:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(79,70,229,.32);
        }
        .btn-auth:disabled {
            opacity: .62;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .resend-link {
            margin-top: 16px;
            color: var(--muted);
            font-size: 12.5px;
            line-height: 1.5;
            text-align: center;
        }
        .resend-link button {
            border: 0;
            background: transparent;
            color: var(--primary);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }
        .resend-link button:hover:not(:disabled) { text-decoration: underline; }
        .resend-link button:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
        }
        .success-state {
            margin-top: 20px;
            padding: 20px 16px 4px;
            border-top: 1px solid var(--border);
        }
        .success-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 14px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: var(--success);
            background: #ecfdf5;
        }
        .success-icon i { font-size: 29px; }
        .success-msg {
            margin: 0 auto 10px;
            max-width: 330px;
            color: var(--gray-700);
            font-size: 14px;
            line-height: 1.65;
            text-align: center;
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 9999;
            width: max-content;
            max-width: min(92vw, 520px);
            padding: 13px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--success);
            border-radius: 12px;
            background: rgba(255,255,255,.98);
            color: var(--ink);
            box-shadow: 0 18px 45px rgba(2,6,23,.18);
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transform: translate(-50%, 120px);
            pointer-events: none;
            transition: opacity .25s ease, transform .25s ease;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
        .toast-error { border-left-color: var(--danger); }
        .toast-success i { color: var(--success); }
        .toast-error i { color: var(--danger); }
        @media (max-width: 520px) {
            body {
                align-items: flex-start;
                padding: 22px 14px;
                background-position: 60% center;
            }
            .auth-container { max-width: 100%; }
            .back-home {
                margin-bottom: 16px;
                font-size: 12.5px;
            }
            .brand-wrap { margin-bottom: 18px; }
            .logo-icon {
                width: 42px;
                height: 42px;
                border-radius: 12px;
                font-size: 18px;
            }
            .logo-text { font-size: 26px; }
            .auth-card {
                border-radius: 20px;
                padding: 28px 18px 24px;
            }
            .verify-icon {
                width: 58px;
                height: 58px;
                border-radius: 18px;
            }
            .otp-inputs { gap: 6px; }
            .otp-inputs input {
                width: min(13vw, 46px);
                height: 52px;
                border-radius: 10px;
                font-size: 20px;
            }
            .subtitle { font-size: 13px; margin-bottom: 22px; }
            .toast {
                bottom: 14px;
                font-size: 12.5px;
            }
        }
        @media (max-width: 350px) {
            .auth-card { padding-inline: 14px; }
            .otp-inputs { gap: 4px; }
            .otp-inputs input {
                width: 39px;
                height: 48px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
<style>/* HeavenLease brand mark */ .brand-logo-image{width:100%;height:100%;display:block;object-fit:contain;border-radius:inherit}.logo-icon,.hl-logo-icon,.logo-mark,.mark{overflow:hidden}</style>
</head>
<body>
    <main class="auth-container" aria-labelledby="verifyTitle">
        <a href="login" class="back-home" aria-label="Back to Sign In">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
            <span>Back to Sign In</span>
        </a>
        <div class="brand-wrap">
            <div class="auth-brand" aria-label="HeavenLease">
                <div class="logo-icon" aria-hidden="true"><img src="logo.svg" alt="HeavenLease" class="brand-logo-image"></div>
                <span class="logo-text">Heaven<span>Lease</span></span>
            </div>
        </div>
        <section class="auth-card" aria-live="polite">
            <div class="card-kicker">
                <i class="fas fa-shield-halved" aria-hidden="true"></i>
                Account verification
            </div>
            <div class="verify-icon" aria-hidden="true">
                <i class="fas fa-envelope"></i>
            </div>
            <h1 id="verifyTitle">Verify Your Email</h1>
            <p class="subtitle">
                We've sent a 6-digit verification code to your email address.
                Enter it below to verify your account.
            </p>
            <div class="email-display" id="emailDisplay" aria-label="Email address">
                you@example.com
            </div>
            <label class="otp-label" for="otp-1">Enter 6-digit code</label>
            <div class="otp-inputs" id="otpInputs" role="group" aria-label="6-digit verification code">
                <input id="otp-1" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" autocomplete="one-time-code" aria-label="Verification digit 1" oninput="handleOtpInput(this)">
                <input id="otp-2" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" aria-label="Verification digit 2" oninput="handleOtpInput(this)">
                <input id="otp-3" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" aria-label="Verification digit 3" oninput="handleOtpInput(this)">
                <input id="otp-4" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" aria-label="Verification digit 4" oninput="handleOtpInput(this)">
                <input id="otp-5" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" aria-label="Verification digit 5" oninput="handleOtpInput(this)">
                <input id="otp-6" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" aria-label="Verification digit 6" oninput="handleOtpInput(this)">
            </div>
            <button class="btn-auth" id="verifyBtn" type="button" onclick="verifyEmail()">
                <i class="fas fa-check-circle" aria-hidden="true"></i>
                <span>Verify Email</span>
            </button>
            <div class="resend-link">
                Didn't receive it?
                <button type="button" id="resendBtn" onclick="resendCode()">Resend</button>
            </div>
            <div id="successSection" class="success-state" style="display: none;">
                <div class="success-icon" aria-hidden="true">
                    <i class="fas fa-check-circle"></i>
                </div>
                <p class="success-msg">
                    Email verified successfully! Redirecting to your dashboard...
                </p>
            </div>
        </section>
    </main>
    <div class="toast toast-success" id="toast" role="status" aria-live="polite">
        <i class="fas fa-circle-check" aria-hidden="true"></i>
        <span id="toastMessage"></span>
    </div>
    <script src="js/api.js?v=20260915a"></script>
    
    <script src="js/pages/verify-email.js?v=20260915a"></script>
</body>
</html>
