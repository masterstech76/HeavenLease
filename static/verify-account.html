<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Verify your HeavenLease account with the OTP sent to your email or phone.">
    <title>Verify Account — HeavenLease</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css?v=20260909a">
    <link rel="stylesheet" href="styles.css?v=20260909a">
    <style>
        :root {
            --v-ink: #142019;
            --v-muted: #66736c;
            --v-green: #1f6b4f;
            --v-green-dark: #174d3a;
            --v-gold: #d5ae67;
            --v-line: #e5e9e5;
            --v-soft: #f5f7f5;
            --v-error: #c43d3d;
            --v-success: #198754;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { min-height: 100%; }
        body {
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            color: var(--v-ink);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
            position: relative;
            overflow-x: hidden;
            background:
                linear-gradient(120deg, rgba(7,20,14,.91), rgba(14,37,27,.68)),
                url("https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=2200&q=85")
                center / cover fixed no-repeat;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(0,0,0,.28), transparent 50%),
                linear-gradient(0deg, rgba(5,17,11,.38), transparent 50%);
            pointer-events: none;
        }
        .auth-container {
            width: min(100%, 460px);
            position: relative;
            z-index: 1;
        }
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            color: rgba(255,255,255,.82);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: .2s ease;
        }
        .back-home:hover {
            color: #fff;
            transform: translateX(-2px);
        }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            margin-bottom: 20px;
        }
        .auth-brand .logo-icon {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            color: #fff;
            font-size: 19px;
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.24);
            box-shadow: inset 0 1px rgba(255,255,255,.16);
            backdrop-filter: blur(10px);
        }
        .auth-brand .logo-icon i { color: var(--v-gold); }
        .auth-brand .logo-text {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -.3px;
        }
        .auth-brand .logo-text span { color: var(--v-gold); }
        .auth-card {
            background: rgba(255,255,255,.97);
            border: 1px solid rgba(255,255,255,.72);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 30px 80px rgba(0,0,0,.28);
            backdrop-filter: blur(16px);
        }
        .verify-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 22px;
            background: #edf5f0;
            border: 1px solid #dcebe2;
        }
        .verify-icon i {
            font-size: 30px;
            color: var(--v-green);
        }
        .auth-card h1 {
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(27px, 6vw, 32px);
            line-height: 1.15;
            font-weight: 700;
            color: var(--v-ink);
            text-align: center;
            margin-bottom: 9px;
        }
        .auth-card .subtitle {
            max-width: 365px;
            margin: 0 auto 27px;
            text-align: center;
            color: var(--v-muted);
            font-size: 13px;
            line-height: 1.7;
        }
        .auth-card .subtitle strong {
            color: var(--v-ink);
            font-weight: 700;
            overflow-wrap: anywhere;
        }
        .otp-label {
            display: block;
            margin-bottom: 10px;
            text-align: center;
            color: #59675f;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
        }
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 9px;
            margin-bottom: 20px;
        }
        .otp-inputs input {
            width: 50px;
            height: 56px;
            flex: 0 0 50px;
            border: 1px solid var(--v-line);
            border-radius: 13px;
            background: var(--v-soft);
            color: var(--v-ink);
            text-align: center;
            font: 800 23px/1 "Inter", sans-serif;
            caret-color: var(--v-green);
            transition: .2s ease;
        }
        .otp-inputs input:hover { border-color: #c9d5ce; }
        .otp-inputs input:focus {
            outline: none;
            border-color: var(--v-green);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(31,107,79,.11);
            transform: translateY(-1px);
        }
        .btn-auth {
            width: 100%;
            min-height: 50px;
            padding: 13px 18px;
            border: 0;
            border-radius: 13px;
            background: var(--v-green);
            color: #fff;
            font: 800 14px/1.2 "Inter", sans-serif;
            cursor: pointer;
            box-shadow: 0 12px 26px rgba(31,107,79,.22);
            transition: .2s ease;
        }
        .btn-auth:hover {
            background: var(--v-green-dark);
            transform: translateY(-1px);
            box-shadow: 0 16px 30px rgba(31,107,79,.28);
        }
        .btn-auth:focus-visible,
        .resend-link button:focus-visible,
        .back-home:focus-visible {
            outline: 3px solid rgba(213,174,103,.55);
            outline-offset: 3px;
        }
        .btn-auth:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }
        .resend-link {
            margin-top: 16px;
            text-align: center;
            color: #738078;
            font-size: 12px;
        }
        .resend-link button {
            border: 0;
            background: none;
            color: var(--v-green);
            font: 800 12px "Inter", sans-serif;
            cursor: pointer;
            padding: 3px 2px;
        }
        .resend-link button:hover:not(:disabled) { text-decoration: underline; }
        .resend-link button:disabled {
            color: #9da7a1;
            cursor: not-allowed;
        }
        .success-section {
            margin-top: 22px;
            padding: 22px 16px 4px;
            border-top: 1px solid var(--v-line);
            text-align: center;
        }
        .success-icon {
            width: 66px;
            height: 66px;
            margin: 0 auto 13px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #eaf7f0;
        }
        .success-icon i {
            font-size: 31px;
            color: var(--v-success);
        }
        .success-msg {
            color: #405048;
            font-size: 14px;
            line-height: 1.65;
        }
        .security-note {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            margin-top: 18px;
            color: rgba(255,255,255,.66);
            font-size: 11px;
            text-align: center;
        }
        .security-note i { color: var(--v-gold); }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            z-index: 9999;
            width: max-content;
            max-width: min(92vw, 460px);
            padding: 13px 17px;
            display: flex;
            align-items: center;
            gap: 9px;
            border-radius: 12px;
            background: #fff;
            color: var(--v-ink);
            box-shadow: 0 18px 50px rgba(0,0,0,.22);
            border-left: 4px solid var(--v-success);
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transform: translate(-50%, 90px);
            pointer-events: none;
            transition: .3s ease;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
        .toast-error { border-left-color: var(--v-error); }
        .toast-success i { color: var(--v-success); }
        .toast-error i { color: var(--v-error); }
        @media (max-width: 560px) {
            body {
                padding: 20px 13px;
                background:
                    linear-gradient(135deg, rgba(7,20,14,.94), rgba(14,37,27,.78)),
                    url("https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1400&q=85")
                    center / cover fixed no-repeat;
            }
            .auth-container { max-width: 430px; }
            .back-home { margin-bottom: 14px; }
            .auth-brand { margin-bottom: 16px; }
            .auth-brand .logo-text { font-size: 25px; }
            .auth-card {
                padding: 28px 18px 24px;
                border-radius: 21px;
            }
            .verify-icon {
                width: 62px;
                height: 62px;
                border-radius: 18px;
                margin-bottom: 17px;
            }
            .verify-icon i { font-size: 26px; }
            .auth-card .subtitle {
                font-size: 12.5px;
                margin-bottom: 23px;
            }
            .otp-inputs {
                gap: clamp(5px, 2.2vw, 9px);
            }
            .otp-inputs input {
                width: clamp(42px, 13vw, 50px);
                height: 52px;
                flex-basis: clamp(42px, 13vw, 50px);
                border-radius: 11px;
                font-size: 21px;
            }
            .btn-auth { min-height: 52px; }
        }
        @media (max-width: 370px) {
            body { padding-left: 9px; padding-right: 9px; }
            .auth-card { padding-left: 13px; padding-right: 13px; }
            .otp-inputs { gap: 4px; }
            .otp-inputs input {
                width: 41px;
                flex-basis: 41px;
                height: 50px;
                font-size: 19px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .back-home, .otp-inputs input, .btn-auth, .toast { transition: none; }
        }
    </style>
</head>
<body>
    <main class="auth-container">
        <a href="login" class="back-home" aria-label="Back to Sign In">
            <i class="fas fa-arrow-left"></i> Back to Sign In
        </a>
        <div class="auth-brand" aria-label="HeavenLease">
            <div class="logo-icon"><i class="fas fa-home"></i></div>
            <span class="logo-text">Heaven<span>Lease</span></span>
        </div>
        <section class="auth-card" aria-labelledby="verifyTitle">
            <div class="verify-icon" aria-hidden="true">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h1 id="verifyTitle">Verify Your Account</h1>
            <p class="subtitle">
                Enter the 6-digit OTP sent to
                <strong id="verifyTarget">your email/phone</strong>
                to verify your account.
            </p>
            <label class="otp-label" for="otpDigit1">6-digit verification code</label>
            <div class="otp-inputs" id="otpInputs">
                <input id="otpDigit1" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" class="otp-digit" aria-label="OTP digit 1" oninput="handleOtpInput(this)">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" aria-label="OTP digit 2" oninput="handleOtpInput(this)">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" aria-label="OTP digit 3" oninput="handleOtpInput(this)">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" aria-label="OTP digit 4" oninput="handleOtpInput(this)">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" aria-label="OTP digit 5" oninput="handleOtpInput(this)">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" aria-label="OTP digit 6" oninput="handleOtpInput(this)">
            </div>
            <button class="btn-auth" id="verifyBtn" type="button" onclick="verifyAccount()">
                <i class="fas fa-check-circle"></i> Verify Account
            </button>
            <div class="resend-link">
                Didn't receive it?
                <button type="button" id="resendBtn" onclick="resendCode()">Resend</button>
            </div>
            <div id="successSection" class="success-section" style="display: none;">
                <div class="success-icon"><i class="fas fa-check-circle"></i></div>
                <p class="success-msg">Account verified successfully! Redirecting to your dashboard...</p>
            </div>
        </section>
        <div class="security-note">
            <i class="fas fa-lock"></i>
            <span>Your verification is protected by HeavenLease.</span>
        </div>
    </main>
    <script src="js/api.js?v=20260913a"></script>
    
    <script src="js/pages/verify-account.js?v=20260913a"></script>
</body>
</html>
