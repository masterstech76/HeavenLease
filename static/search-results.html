<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>HeavenLease &mdash; Redirecting&hellip;</title>
    <meta http-equiv="refresh" content="0; url=properties">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh;
            background: linear-gradient(rgba(15,23,42,0.88), rgba(30,27,75,0.85)),
                        url('bg-home.jpg') center/cover fixed no-repeat;
            display: flex; align-items: center; justify-content: center; padding: 24px; overflow-x: hidden; }
        .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 26px; }
        .brand .logo-icon { width: 52px; height: 52px; background: linear-gradient(135deg, #4F46E5, #10B981);
            border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff;
            font-size: 24px; box-shadow: 0 8px 24px rgba(79,70,229,.35); }
        .brand .logo-text { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 700; color: #fff; }
        .brand .logo-text span { color: #818CF8; }
        .card { max-width: 420px; width: 100%; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.14); border-radius: 20px; padding: 34px 30px; text-align: center;
            box-shadow: 0 24px 60px rgba(15,23,42,.35); }
        .spinner { width: 42px; height: 42px; margin: 0 auto 18px; border: 4px solid rgba(255,255,255,.22);
            border-top-color: #818CF8; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 8px; }
        p { font-size: 14px; color: rgba(255,255,255,.72); line-height: 1.6; }
        .link { display: inline-block; margin-top: 18px; color: #A5B4FC; font-size: 13px; }
        @media (max-width: 480px) { .card { padding: 24px 20px; } h1 { font-size: 17px; } }
    </style>
    <script>window.location.replace('properties');</script>
</head>
<body>
    <div style="width:100%;max-width:460px;text-align:center;position:relative;z-index:1;">
        <div class="brand">
            <div class="logo-icon"><i class="fas fa-home"></i></div>
            <span class="logo-text">Heaven<span>Lease</span></span>
        </div>
        <div class="card">
            <div class="spinner"></div>
            <h1>Taking you to Browse Properties&hellip;</h1>
            <p>If you are not redirected automatically, tap the link below.</p>
            <a class="link" href="properties">Continue to Browse Properties &rarr;</a>
        </div>
    </div>
</body>
</html>
