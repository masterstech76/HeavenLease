<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your HeavenLease password using email OTP verification.">
    <title>Forgot Password — HeavenLease</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=20260909a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(rgba(15,23,42,0.85), rgba(30,27,75,0.82)), url('bg-home.jpg') center/cover fixed no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -200px;
            left: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .back-home:hover { color: #fff; }

        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .auth-brand .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #4F46E5, #10B981);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4);
        }

        .auth-brand .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }

        .auth-brand .logo-text span { color: #818CF8; }

        .auth-card {
            background: #fff;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .auth-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
            text-align: center;
        }

        .auth-card .subtitle {
            font-size: 14px;
            color: #64748b;
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-wrap { position: relative; }

        .input-wrap > i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 15px;
        }

        .input-wrap input {
            width: 100%;
            padding: 12px 40px 12px 42px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
            font-size: 14px;
            color: #0f172a;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .input-wrap input:focus {
            outline: none;
            border-color: #4F46E5;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .btn-auth {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4F46E5, #6366F1);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
        }

        .btn-auth:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4); }
        .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .auth-switch {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-top: 20px;
        }

        .auth-switch a { color: #4F46E5; font-weight: 600; text-decoration: none; }
        .auth-switch a:hover { text-decoration: underline; }

        /* OTP Section */
        .otp-section { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
        .otp-section.show { display: block; }

        .otp-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 18px;
        }

        .otp-inputs input {
            width: 46px;
            height: 52px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
            color: #0f172a;
            font-family: 'Inter', sans-serif;
        }

        .otp-inputs input:focus {
            outline: none;
            border-color: #4F46E5;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .otp-info {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 18px;
            line-height: 1.6;
        }

        .otp-info strong { color: #4F46E5; }

        .resend-link {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-top: 14px;
        }

        .resend-link button {
            background: none;
            border: none;
            color: #4F46E5;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .resend-link button:disabled { color: #94a3b8; cursor: not-allowed; }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #fff;
            color: #0f172a;
            padding: 14px 24px;
            border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s ease;
            border-left: 4px solid #10B981;
            max-width: 90vw;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-error { border-left-color: #EF4444; }
        .toast-success i { color: #10B981; }
        .toast-error i { color: #EF4444; }

        @media (max-width: 480px) {
            .auth-card { padding: 24px; }
        }
    </style>
<script>
        // Back-button auth guard — if a session already exists, never show this auth page.
        (function () {
            try {
                if (localStorage.getItem('heavenlease_token') || sessionStorage.getItem('heavenlease_token')) {
                    location.replace('home');
                }
            } catch (e) { /* storage unavailable — ignore */ }
        })();
    </script>
</head>
<body>
    <div class="auth-container">
        <a href="login" class="back-home">
            <i class="fas fa-arrow-left"></i> Back to Sign In
        </a>

        <div class="auth-brand">
            <div class="logo-icon"><i class="fas fa-home"></i></div>
            <span class="logo-text">Heaven<span>Lease</span></span>
        </div>

        <div class="auth-card">
            <h1>Forgot Password</h1>
            <p class="subtitle">Enter your email and we'll send you an OTP to reset your password.</p>

            <form id="forgotForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                </div>

                <button type="submit" class="btn-auth" id="sendOtpBtn">
                    <i class="fas fa-paper-plane"></i> Send OTP
                </button>

                <!-- OTP Verification -->
                <div class="otp-section" id="otpSection">
                    <div class="otp-info">
                        Enter the 6-digit code sent to <strong id="otpTarget"></strong>
                    </div>
                    <div class="otp-inputs" id="otpInputs">
                        <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                        <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                        <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                        <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                        <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                        <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                    </div>
                    <button type="button" class="btn-auth" id="verifyOtpBtn" onclick="verifyForgotOtp()">
                        <i class="fas fa-check-circle"></i> Verify OTP
                    </button>
                    <div class="resend-link">
                        Didn't receive it? <button type="button" id="resendOtpBtn" onclick="resendOtp()">Resend</button>
                    </div>
                </div>
            </form>

            <p class="auth-switch">
                Remembered your password? <a href="login">Sign in</a>
            </p>
        </div>
    </div>

    <script src="api.js?v=20260913a"></script>
    <script>
        let forgotEmail = '';

        function handleOtpInput(el) {
            if (el.value.length === 1) {
                const next = el.nextElementSibling;
                if (next) next.focus();
            }
        }
        window.handleOtpInput = handleOtpInput;

        function getOtpValue() {
            const inputs = document.querySelectorAll('#otpInputs .otp-digit');
            return Array.from(inputs).map(i => i.value).join('');
        }

        function clearOtp() {
            document.querySelectorAll('#otpInputs .otp-digit').forEach(i => i.value = '');
        }

        function startCountdown(btnId) {
            const btn = document.getElementById(btnId);
            let seconds = 30;
            btn.disabled = true;
            btn.textContent = 'Resend in ' + seconds + 's';
            const interval = setInterval(() => {
                seconds--;
                if (seconds <= 0) {
                    clearInterval(interval);
                    btn.disabled = false;
                    btn.textContent = 'Resend';
                } else {
                    btn.textContent = 'Resend in ' + seconds + 's';
                }
            }, 1000);
        }

        // Step 1: Send OTP
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            forgotEmail = document.getElementById('email').value.trim();

            if (!forgotEmail || !isValidEmail(forgotEmail)) {
                showToast('Please enter a valid email address.', 'error');
                return;
            }

            const btn = document.getElementById('sendOtpBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending OTP...';

            try {
                const res = await api.forgotPassword(forgotEmail);
                document.getElementById('otpSection').classList.add('show');
                document.getElementById('otpTarget').textContent = forgotEmail;
                clearOtp();
                btn.style.display = 'none';

                showToast('If the email exists, a reset code has been sent. Check your inbox.', 'success');
                startCountdown('resendOtpBtn');
            } catch (error) {
                showToast(error.message || 'Failed to send OTP.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
            }
        });

        // Step 2: Verify OTP
        window.verifyForgotOtp = async function() {
            const code = getOtpValue();
            if (code.length !== 6) {
                showToast('Please enter the 6-digit OTP.', 'error');
                return;
            }

            const btn = document.getElementById('verifyOtpBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

            try {
                const data = await api.verifyResetOtp(forgotEmail, code);
                showToast('OTP verified! Create your new password.', 'success');
                // Redirect to reset password page with the verified email + short-lived reset token
                setTimeout(() => {
                    window.location.href = 'reset-password?email=' + encodeURIComponent(forgotEmail) + '&token=' + encodeURIComponent(data.resetToken);
                }, 1000);
            } catch (error) {
                showToast(error.message || 'Invalid OTP. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify OTP';
            }
        };

        // Resend OTP
        window.resendOtp = async function() {
            if (!forgotEmail) return;
            try {
                const res = await api.forgotPassword(forgotEmail);

                showToast('If the email exists, a reset code has been sent to your email.', 'success');
                startCountdown('resendOtpBtn');
            } catch (error) {
                showToast(error.message || 'Failed to resend OTP.', 'error');
            }
        };
    </script>
</body>
</html>
