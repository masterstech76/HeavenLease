<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your HeavenLease password using email OTP verification.">
    <title>Forgot Password — HeavenLease</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css?v=20260909a">
    <link rel="stylesheet" href="styles.css?v=20260909a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --ink: #182033;
            --ink-soft: #263247;
            --muted: #687386;
            --line: #e4e7ee;
            --surface: #ffffff;
            --surface-soft: #f7f8fc;
            --primary: #5b5ce2;
            --primary-dark: #4445c5;
            --accent: #10b981;
        }
        html { min-height: 100%; }
        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background:
                linear-gradient(120deg, rgba(8, 15, 31, .94), rgba(23, 24, 67, .86)),
                url('bg-home.jpg') center / cover fixed no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 12% 15%, rgba(129, 140, 248, .18), transparent 30%),
                radial-gradient(circle at 88% 84%, rgba(16, 185, 129, .12), transparent 28%);
        }
        body::after {
            content: '';
            position: fixed;
            width: 520px;
            height: 520px;
            right: -250px;
            top: -240px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.10);
            box-shadow:
                0 0 0 70px rgba(255,255,255,.018),
                0 0 0 140px rgba(255,255,255,.012);
            pointer-events: none;
        }
        .auth-container {
            width: min(100%, 460px);
            position: relative;
            z-index: 1;
        }
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,.76);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 18px 4px;
            transition: color .2s ease, transform .2s ease;
        }
        .back-home:hover {
            color: #fff;
            transform: translateX(-2px);
        }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .auth-brand .logo-icon {
            width: 46px;
            height: 46px;
            flex: 0 0 46px;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 20px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow: 0 12px 30px rgba(79,70,229,.34);
        }
        .auth-brand .logo-text {
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-size: 29px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: -.5px;
        }
        .auth-brand .logo-text span { color: #aeb1ff; }
        .auth-card {
            background: rgba(255,255,255,.97);
            border: 1px solid rgba(255,255,255,.7);
            border-radius: 24px;
            padding: 38px;
            box-shadow:
                0 30px 90px rgba(0,0,0,.38),
                0 8px 24px rgba(0,0,0,.12);
            backdrop-filter: blur(14px);
        }
        .card-kicker {
            width: fit-content;
            margin: 0 auto 14px;
            padding: 6px 10px;
            border: 1px solid #eef0ff;
            border-radius: 999px;
            background: #f5f6ff;
            color: var(--primary-dark);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .auth-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(28px, 5vw, 34px);
            line-height: 1.15;
            text-align: center;
            color: var(--ink);
            margin-bottom: 8px;
            letter-spacing: -.4px;
        }
        .auth-card .subtitle {
            max-width: 360px;
            margin: 0 auto 28px;
            color: var(--muted);
            text-align: center;
            font-size: 14px;
            line-height: 1.65;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: var(--ink-soft);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .02em;
        }
        .input-wrap { position: relative; }
        .input-wrap > i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa3b2;
            font-size: 14px;
            pointer-events: none;
            z-index: 1;
        }
        .input-wrap input {
            width: 100%;
            min-height: 50px;
            padding: 13px 15px 13px 43px;
            border: 1px solid var(--line);
            border-radius: 12px;
            outline: none;
            background: var(--surface-soft);
            color: var(--ink);
            font: 500 14px 'Inter', sans-serif;
            transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
        }
        .input-wrap input::placeholder { color: #9aa3b2; }
        .input-wrap input:hover { border-color: #d4d8e2; }
        .input-wrap input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79,70,229,.11);
        }
        .btn-auth {
            width: 100%;
            min-height: 51px;
            border: 0;
            border-radius: 12px;
            padding: 13px 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            background: linear-gradient(135deg, var(--primary), #5b5ce2);
            color: #fff;
            font: 700 14px 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(79,70,229,.24);
            transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
        }
        .btn-auth:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(79,70,229,.30);
        }
        .btn-auth:active { transform: translateY(0); }
        .btn-auth:disabled {
            opacity: .62;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .otp-section {
            display: none;
            margin-top: 22px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
        }
        .otp-section.show { display: block; }
        .otp-info {
            margin: 0 auto 18px;
            max-width: 340px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }
        .otp-info strong {
            color: var(--primary-dark);
            overflow-wrap: anywhere;
        }
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
        }
        .otp-inputs input {
            width: 46px;
            height: 54px;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface-soft);
            color: var(--ink);
            text-align: center;
            font: 800 21px 'Inter', sans-serif;
            outline: none;
            transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
        }
        .otp-inputs input:hover { border-color: #d4d8e2; }
        .otp-inputs input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79,70,229,.11);
        }
        .resend-link {
            margin-top: 15px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }
        .resend-link button {
            border: 0;
            padding: 0;
            background: transparent;
            color: var(--primary);
            font: 700 12px 'Inter', sans-serif;
            cursor: pointer;
        }
        .resend-link button:hover { text-decoration: underline; }
        .resend-link button:disabled {
            color: #9aa3b2;
            cursor: not-allowed;
            text-decoration: none;
        }
        .auth-switch {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #eef0f4;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }
        .auth-switch a {
            color: var(--primary);
            font-weight: 800;
            text-decoration: none;
        }
        .auth-switch a:hover { text-decoration: underline; }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            width: max-content;
            max-width: min(90vw, 560px);
            padding: 13px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #e5e7eb;
            border-left: 4px solid var(--accent);
            border-radius: 12px;
            background: rgba(255,255,255,.98);
            color: var(--ink);
            box-shadow: 0 16px 45px rgba(0,0,0,.20);
            font-size: 13px;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transform: translateX(-50%) translateY(100px);
            transition: opacity .3s ease, transform .3s ease;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast-error { border-left-color: #ef4444; }
        .toast-success i { color: var(--accent); }
        .toast-error i { color: #ef4444; }
        @media (max-width: 560px) {
            body {
                align-items: flex-start;
                padding: 22px 14px;
            }
            .auth-container {
                margin: auto 0;
            }
            .back-home { margin-left: 2px; }
            .auth-card {
                padding: 28px 20px 24px;
                border-radius: 20px;
            }
            .auth-brand { margin-bottom: 17px; }
            .auth-brand .logo-icon {
                width: 42px;
                height: 42px;
                flex-basis: 42px;
                border-radius: 12px;
                font-size: 18px;
            }
            .auth-brand .logo-text { font-size: 26px; }
            .otp-inputs { gap: 6px; }
            .otp-inputs input {
                width: 43px;
                height: 51px;
                border-radius: 10px;
            }
        }
        @media (max-width: 370px) {
            .auth-card { padding-inline: 16px; }
            .otp-inputs { gap: 4px; }
            .otp-inputs input {
                width: 39px;
                height: 48px;
                font-size: 19px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <a href="login" class="back-home">
            <i class="fas fa-arrow-left"></i> Back to Sign In
        </a>
        <div class="auth-brand">
            <div class="logo-icon"><i class="fas fa-home"></i></div>
            <span class="logo-text">Heaven<span>Lease</span></span>
        </div>
        <div class="auth-card">
            <div class="card-kicker">Account recovery</div>
            <h1>Forgot Password</h1>
            <p class="subtitle">Enter your email and we'll send you an OTP to reset your password.</p>
            <form id="forgotForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                </div>
                <button type="submit" class="btn-auth" id="sendOtpBtn">
                    <i class="fas fa-paper-plane"></i> Send OTP
                </button>
                <!-- OTP Verification -->
                <div class="otp-section" id="otpSection">
                    <div class="otp-info">
                        Enter the 6-digit code sent to <strong id="otpTarget"></strong>
                    </div>
                    <div class="otp-inputs" id="otpInputs">
                        <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                        <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                        <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                        <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                        <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                        <input type="text" maxlength="1" class="otp-digit" oninput="handleOtpInput(this)">
                    </div>
                    <button type="button" class="btn-auth" id="verifyOtpBtn" onclick="verifyForgotOtp()">
                        <i class="fas fa-check-circle"></i> Verify OTP
                    </button>
                    <div class="resend-link">
                        Didn't receive it? <button type="button" id="resendOtpBtn" onclick="resendOtp()">Resend</button>
                    </div>
                </div>
            </form>
            <p class="auth-switch">
                Remembered your password? <a href="login">Sign in</a>
            </p>
        </div>
    </div>
    <script src="js/api.js?v=20260913a"></script>
    <script src="js/core.js?v=20260913a"></script>
    <script src="js/pages/forgot-password.js?v=20260913a"></script>
</body>
</html>
